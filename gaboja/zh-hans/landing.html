/* 캐릭터 칸: .chw(둥실 움직임) 안에 .gfx(chars.js 등장·반복 이펙트). 폰은 넷을 다 넣어 두고 .on 하나만 보임 */

/* 화면: PC(가로가 넓을 때) = 창 넷 · 폰(좁거나 세로로 길 때) = 창 하나가 닫혔다 열리며 성향이 바뀜 */

/* 폰: 열린 채 4초 → 닫힘 1.9초(빛 꺼짐, 이름은 거의 닫혔을 때 사라짐) → 닫힌 채 1.2초 → 다음 성향으로 바꿔 열림(빛은 늦게 차오름)

  const dy = (baseOf(document.querySelector('.top .vz')) - l.getBoundingClientRect().bottom) / sc; l.style.setProperty('--lgy', dy.toFixed(1) + 'px'); };
/* PC: 글 묶음 아래 끝 = 언어 토글 윗선 (토글 크기·위치가 바뀌면 같이 따라감) */

  const top = (document.getElementById('lang').getBoundingClientRect().top - st.top) / sc; tx.style.bottom = (900 - top).toFixed(1) + 'px'; };

paintLang(); build(); all(); if (!REDUCED) requestAnimationFrame(tick);
let rq = 0; addEventListener('resize', () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(all); });

})();
