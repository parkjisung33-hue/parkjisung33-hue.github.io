<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가보자 여행 유형</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF0F3">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Pretendard 1.3.9 (SIL OFL 1.1) — 앱 시안과 같은 fonts/ 파일 */
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-style: normal; font-display: swap;
  src: local("Pretendard Variable"), url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2"); }
/* 레이아웃: 앱 시안(index.html)과 같은 토큰·유리 질감. 한 화면 한 질문 → 아래 출발 안내판(코드 4칸)이 답할 때마다 넘어가며 채워짐 → 결과 = 탑승권.
   크기는 전부 rem (390px 폰 = 16px 기준, 앱과 같은 규칙) */
:root {
  color-scheme: light;
  --canvas: #EEF0F3; --ink: #15171A; --sub: #6F757D; --hair: rgba(21,23,26,.09); --on-ink: #FFFFFF;
  --glass: rgba(255,255,255,.62); --glass-hi: rgba(255,255,255,.94); --glass-edge: rgba(255,255,255,.85); --glass-hl: rgba(255,255,255,.9);
  --paper: #FFFFFF; --tile: rgba(255,255,255,.86); --tile-edge: rgba(255,255,255,.98); --field: #FFFFFF;
  --red: #E0453A; --amber: #E8A317; --blue: #3B5BDB; --blue-soft: rgba(59,91,219,.09);
  --flap: #1B1E23; --flap-tx: #F4F5F7; --flap-dim: #5B616A;
  --toast-bg: rgba(21,23,26,.92); --toast-fg: #FFFFFF;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(24,36,60,.32), 0 2px 0.375rem -2px rgba(24,36,60,.10);
  --sh-xs: 0 1px 2px rgba(24,36,60,.05), 0 0.25rem 0.75rem -0.375rem rgba(24,36,60,.14);
  --kr: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-lg: 1.625rem; --r-md: 1.25rem; --r-sm: 0.875rem;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --canvas: #0E1013; --ink: #ECEEF1; --sub: #8F969F; --hair: rgba(255,255,255,.08); --on-ink: #0E1013;
  --glass: rgba(30,33,38,.62); --glass-hi: rgba(255,255,255,.14); --glass-edge: rgba(255,255,255,.08); --glass-hl: rgba(255,255,255,.06);
  --paper: #1B1E23; --tile: rgba(36,40,46,.9); --tile-edge: rgba(255,255,255,.06); --field: #15181C;
  --red: #F2675D; --amber: #F0B43C; --blue: #8095F5; --blue-soft: rgba(128,149,245,.12);
  --flap: #05070A; --flap-tx: #F4F5F7; --flap-dim: #4A5058;
  --toast-bg: rgba(236,238,241,.95); --toast-fg: #15171A;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(0,0,0,.7), 0 2px 0.375rem -2px rgba(0,0,0,.4);
  --sh-xs: 0 1px 2px rgba(0,0,0,.35), 0 0.25rem 0.75rem -0.375rem rgba(0,0,0,.55); } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0E1013; --ink: #ECEEF1; --sub: #8F969F; --hair: rgba(255,255,255,.08); --on-ink: #0E1013;
  --glass: rgba(30,33,38,.62); --glass-hi: rgba(255,255,255,.14); --glass-edge: rgba(255,255,255,.08); --glass-hl: rgba(255,255,255,.06);
  --paper: #1B1E23; --tile: rgba(36,40,46,.9); --tile-edge: rgba(255,255,255,.06); --field: #15181C;
  --red: #F2675D; --amber: #F0B43C; --blue: #8095F5; --blue-soft: rgba(128,149,245,.12);
  --flap: #05070A; --flap-tx: #F4F5F7; --flap-dim: #4A5058;
  --toast-bg: rgba(236,238,241,.95); --toast-fg: #15171A;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(0,0,0,.7), 0 2px 0.375rem -2px rgba(0,0,0,.4);
  --sh-xs: 0 1px 2px rgba(0,0,0,.35), 0 0.25rem 0.75rem -0.375rem rgba(0,0,0,.55); }

html { font-size: clamp(13.5px, calc(100vw * 16 / 390), 18px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--canvas); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; word-break: keep-all; overflow-wrap: anywhere; background: var(--canvas); color: var(--ink); font-family: var(--kr); font-size: 0.9375rem; line-height: 1.5; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--canvas); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit; }
/* 포커스 테두리는 안쪽으로 (바깥으로 그리면 main의 overflow-x: clip에 좌우가 잘림) */
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
/* 2. 비행기 편 입력 (가는 편·오는 편 × 편명·출발·도착) */
.flbox { display: flex; flex-direction: column; gap: 0.875rem; animation: drop .22s cubic-bezier(.2,.8,.2,1); }
.flr { display: flex; flex-direction: column; gap: 0.4375rem; }
.flr .fll { font-size: 0.75rem; font-weight: 700; color: var(--sub); }
.flr .tms { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.flr .tms label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.6875rem; color: var(--sub); }
.flr .in.tm { height: 2.875rem; padding: 0 0.75rem; }
.flr .in.fno { text-transform: uppercase; }
.flr .in.fno::placeholder { text-transform: none; }
a { color: inherit; }
[hidden] { display: none !important; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(1.25rem) saturate(1.5); backdrop-filter: blur(1.25rem) saturate(1.5);
  border: 1px solid var(--glass-edge); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hl); }
.wrap { max-width: 27.5rem; margin: 0 auto; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
  padding-left: max(1rem, env(safe-area-inset-left, 0px)); padding-right: max(1rem, env(safe-area-inset-right, 0px)); padding-block: 0 2rem; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.muted { color: var(--sub); }

/* 위 막대: 뒤로 · 진행 · 오른쪽 칸 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 2.75rem minmax(0,1fr) auto; align-items: center; gap: 0.5rem; padding: 0.75rem 0 0.5rem; background: linear-gradient(var(--canvas) 70%, transparent); }
.ib { width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; transition: background .15s; }
.ib:hover { background: var(--hair); }
.ib svg { width: 1.375rem; height: 1.375rem; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib[disabled] { visibility: hidden; }
.prog { display: flex; gap: 0.25rem; align-items: center; min-width: 0; }
.prog i { flex: 1; height: 0.25rem; border-radius: 1rem; background: var(--hair); overflow: hidden; position: relative; }
.prog i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.prog i.on::after { transform: scaleX(1); }
.prog.blue i::after { background: var(--blue); }
.barR { font-size: 0.8125rem; font-weight: 600; color: var(--sub); min-width: 2.75rem; text-align: right; padding: 0.5rem 0.25rem; white-space: nowrap; }
.barR.btn { color: var(--ink); }

/* 화면 */
main { flex: 1; display: flex; flex-direction: column; position: relative; overflow-x: clip; }
.scr { flex: 1; display: flex; flex-direction: column; gap: 1.25rem; padding-top: 0.75rem; animation: inR .32s cubic-bezier(.2,.8,.2,1) both; }
.scr.back { animation-name: inL; }
.scr.leaving { position: absolute; left: 0; right: 0; pointer-events: none; animation: outL .18s ease-in forwards; z-index: 0; }
.scr.leaving.toR { animation-name: outR; }
@keyframes outL { to { opacity: 0; transform: translateX(-1rem); } }
@keyframes outR { to { opacity: 0; transform: translateX(1rem); } }
.scr:not(.leaving) { position: relative; z-index: 1; }
/* 나타나는 입력칸·달력 날짜는 살짝 내려오며 나타남 */
.blk .in, #cityEtc { animation: drop .22s cubic-bezier(.2,.8,.2,1); }
@keyframes drop { from { opacity: 0; transform: translateY(-0.375rem); } to { opacity: 1; transform: none; } }
.cal .gd.swap { animation: calIn .22s ease-out; }
@keyframes calIn { from { opacity: .2; } to { opacity: 1; } }
@keyframes inR { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }
.qh { display: flex; flex-direction: column; gap: 0.5rem; }
.qh h1 { margin: 0; word-break: keep-all; font-size: 1.625rem; font-weight: 800; letter-spacing: -.035em; line-height: 1.28; text-wrap: balance; }
.qh p { margin: 0; font-size: 0.875rem; color: var(--sub); }

/* 성향 질문 보기: 2×2 카드 */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.625rem; }
.opt { position: relative; min-height: 9.25rem; border-radius: var(--r-md); padding: 0.875rem 0.875rem 1rem; display: flex; flex-direction: column; justify-content: space-between; gap: 0.75rem;
  background: var(--tile); border: 1px solid var(--tile-edge); box-shadow: var(--sh-xs); transition: transform .14s, background .2s, color .2s, opacity .25s, box-shadow .2s; }
.opt:active { transform: scale(.97); }
@media (hover: hover) { .opt:hover { box-shadow: var(--shadow); } }
.opt .top { display: flex; justify-content: space-between; align-items: flex-start; }
.opt .ic { width: 2.125rem; height: 2.125rem; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; transition: opacity .2s, transform .3s; }
.opts.done .opt.chosen .ic { opacity: 0; transform: scale(.6); }
@media (hover: hover) { .opt:hover .ic { transform: translateY(-2px) rotate(-4deg); } }
.opt .k { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; background: var(--hair); color: var(--sub); transition: background .2s, color .2s; }
.opt .tx { text-wrap: balance; font-size: 1.03125rem; font-weight: 700; line-height: 1.38; letter-spacing: -.025em; word-break: keep-all; }
.opt .stamp { position: absolute; right: 0.75rem; top: 0.75rem; width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; opacity: 0; transform: scale(1.6) rotate(-24deg); }
.opt .stamp svg { width: 1.125rem; height: 1.125rem; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.opts.done .opt { opacity: .35; pointer-events: none; }
.opts.done .opt.chosen { opacity: 1; background: var(--ink); color: var(--on-ink); border-color: var(--ink); box-shadow: var(--shadow); }
.opts.done .opt.chosen .ic { stroke: var(--on-ink); }
.opts.done .opt.chosen .k { background: rgba(127,127,127,.25); color: inherit; }
.opts.done .opt.chosen .stamp { animation: stamp .34s cubic-bezier(.2,.9,.3,1.4) forwards; }
@keyframes stamp { to { opacity: 1; transform: scale(1) rotate(-12deg); } }
.opt.prev { box-shadow: inset 0 0 0 2px var(--ink), var(--sh-xs); }

/* 아래 출발 안내판: 코드 4칸 */
.board { position: sticky; bottom: max(0.75rem, env(safe-area-inset-bottom, 0px)); margin-top: auto; z-index: 4; border-radius: var(--r-lg); padding: 0.75rem 0.875rem; display: flex; align-items: center; gap: 0.875rem; }
.board .lb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.board .lb b { font-size: 0.8125rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .lb span { font-size: 0.71875rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flaps { display: flex; gap: 0.25rem; perspective: 20rem; flex: none; }
.flaps.big { gap: 0.375rem; }
.fl { width: 1.875rem; height: 2.5rem; border-radius: 0.375rem; background: var(--flap); color: var(--flap-tx); display: grid; place-items: center; font-weight: 700; font-size: 1.25rem; position: relative; overflow: hidden; }
.fl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.55); }
.fl.empty { color: var(--flap-dim); }
.fl.flip { animation: flip .38s cubic-bezier(.3,.7,.3,1); }
@keyframes flip { 0% { transform: rotateX(0); } 45% { transform: rotateX(-88deg); } 55% { transform: rotateX(88deg); } 100% { transform: rotateX(0); } }
.flaps.big .fl { width: 2.75rem; height: 3.625rem; font-size: 1.875rem; border-radius: 0.5rem; }

.cta { width: 100%; height: 3.5rem; border-radius: 62rem; background: var(--ink); color: var(--on-ink); font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: transform .12s, opacity .2s; }
.cta:active { transform: scale(.98); }
.cta[disabled] { opacity: .3; pointer-events: none; }
.cta svg { width: 1.125rem; height: 1.125rem; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ghost { height: 3rem; border-radius: 62rem; font-size: 0.875rem; font-weight: 600; color: var(--sub); display: flex; align-items: center; justify-content: center; }
.ghost:hover { color: var(--ink); }
.foot { display: flex; flex-direction: column; gap: 0.25rem; margin-top: auto; padding-top: 1rem; position: sticky; bottom: max(0.75rem, env(safe-area-inset-bottom, 0px)); }
.foot::before { content: ""; position: absolute; inset: -1.5rem calc(-1 * max(1rem, env(safe-area-inset-right, 0px))) calc(-1 * max(0.75rem, env(safe-area-inset-bottom, 0px))); z-index: -1; background: linear-gradient(transparent, var(--canvas) 40%); pointer-events: none; }

/* 시작 화면: 펼쳐지는 탑승권 세 장 */
.hero { display: flex; flex-direction: column; gap: 0.75rem; padding-top: 0.5rem; }
.hero h1 { margin: 0; word-break: keep-all; font-size: 2.125rem; font-weight: 800; letter-spacing: -.045em; line-height: 1.18; text-wrap: balance; }
.hero p { text-wrap: pretty; margin: 0; color: var(--sub); font-size: 0.9375rem; }
.facts { display: flex; gap: 0.375rem; flex-wrap: wrap; }
.facts span { font-size: 0.75rem; font-weight: 600; padding: 0.3125rem 0.625rem; border-radius: 62rem; background: var(--hair); }
.fan { position: relative; height: 15.5rem; margin: 0.5rem 0 0; }
.fan .mini { position: absolute; left: 50%; top: 1.25rem; width: 15.5rem; margin-left: -7.75rem; transform-origin: 50% 120%; animation: fanIn .9s cubic-bezier(.2,.8,.2,1) both; }
.fan .mini:nth-child(1) { --r: -11deg; --x: -2.25rem; animation-delay: .05s; }
.fan .mini:nth-child(2) { --r: 9deg; --x: 2.25rem; animation-delay: .15s; }
.fan .mini:nth-child(3) { --r: -1deg; --x: 0rem; animation-delay: .25s; z-index: 2; }
@keyframes fanIn { from { opacity: 0; transform: translateY(1.5rem) rotate(0); } to { opacity: 1; transform: translateX(var(--x)) rotate(var(--r)); } }
.mine { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.875rem; border-radius: var(--r-md); background: var(--blue-soft); }
.mine b { font-size: 0.9375rem; }
.mine span { font-size: 0.75rem; color: var(--sub); display: block; }
.mine .go { margin-left: auto; font-size: 0.8125rem; font-weight: 700; color: var(--blue); white-space: nowrap; }

/* 작은 탑승권 (시작 화면·16유형·궁합) */
.mini { border-radius: var(--r-md); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; display: block; width: 100%; text-align: left; }
.mini .t1 { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0.875rem 0; font-size: 0.65625rem; font-weight: 700; letter-spacing: .1em; color: var(--sub); }
.mini .t1 em { font-style: normal; color: var(--red); white-space: nowrap; }
.mini .t1 span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pair .mini .t1 span { display: none; }
.mini .t2 { padding: 0.375rem 0.875rem 0.75rem; display: flex; flex-direction: column; gap: 0.125rem; }
.mini .cd { font-size: 1.625rem; font-weight: 800; letter-spacing: .06em; line-height: 1.1; }
.mini .nm { font-size: 0.9375rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .pf { height: 0; border-top: 2px dashed var(--hair); margin: 0 0.75rem; }
.mini .t3 { padding: 0.5rem 0.875rem 0.75rem; font-size: 0.71875rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 계산 화면 */
.calc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; text-align: center; padding: 3rem 0; }
.calc h2 { margin: 0; font-size: 1.375rem; font-weight: 800; letter-spacing: -.03em; }
.ticks { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; font-size: 0.875rem; color: var(--sub); }
.ticks div { display: flex; align-items: center; gap: 0.5rem; opacity: .35; transition: opacity .25s, color .25s; }
.ticks div.on { opacity: 1; color: var(--ink); }
.ticks svg { width: 1rem; height: 1rem; stroke: var(--blue); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* 결과: 큰 탑승권 */
.ticket { border-radius: var(--r-lg); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pulseT { 0% { box-shadow: var(--shadow), 0 0 0 0 rgba(59,91,219,.5); } 40% { box-shadow: var(--shadow), 0 0 0 0.375rem rgba(59,91,219,.28); } 100% { box-shadow: var(--shadow), 0 0 0 0 rgba(59,91,219,0); } }
.ticket.pulse { animation: pulseT .7s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(1.25rem) scale(.98); } to { opacity: 1; transform: none; } }
.ticket .hd { padding: 1rem 1.125rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.6875rem; font-weight: 700; letter-spacing: .1em; color: var(--sub); }
.ticket .hd b { color: var(--ink); letter-spacing: .02em; font-size: 0.8125rem; }
.ticket .hd em { font-style: normal; color: var(--red); }
.ticket .bd { padding: 1rem 1.125rem 1.125rem; display: flex; flex-direction: column; gap: 0.875rem; }
.ticket .nm { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.045em; line-height: 1.15; }
.ticket .ln { text-wrap: balance; margin: 0; font-size: 0.9375rem; line-height: 1.5; word-break: keep-all; }
.perf { position: relative; height: 0; border-top: 2px dashed var(--hair); margin: 0 1.125rem; }
.perf::before, .perf::after { content: ""; position: absolute; top: -0.75rem; width: 1.375rem; height: 1.375rem; border-radius: 50%; background: var(--canvas); }
.perf::before { left: -1.875rem; } .perf::after { right: -1.875rem; }
.meters { padding: 1rem 1.125rem 0.5rem; display: flex; flex-direction: column; gap: 0.625rem; }
.mt { display: grid; grid-template-columns: 2.625rem minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 0.5rem; font-size: 0.8125rem; }
.mt .ax { font-size: 0.71875rem; color: var(--sub); }
.mt .a, .mt .b { color: var(--sub); white-space: nowrap; }
.mt .b { text-align: right; }
.mt .w { color: var(--ink); font-weight: 700; }
.dots { display: flex; gap: 0.25rem; }
.dots i { width: 0.5625rem; height: 0.5625rem; border-radius: 50%; background: var(--hair); }
.dots i.on { background: var(--ink); }
.dots i.lean { background: var(--sub); opacity: .55; }
.barcode { display: flex; gap: 2px; height: 2.25rem; padding: 0.5rem 1.125rem 1rem; align-items: stretch; }
.barcode i { background: var(--ink); border-radius: 1px; }

.sec { display: flex; flex-direction: column; gap: 0.625rem; }
.sec h3 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -.02em; }
.card { border-radius: var(--r-lg); background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--sh-xs); padding: 0.375rem 1.125rem; }
.scene { display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 0; border-top: 1px solid var(--hair); }
.scene:first-child { border-top: 0; }

  return (DEST[tr.city] === 'tyo' ? apName(tr) + ' · ' : '') + ['fo', 'fb'].map(k => { const f = tr[k] || {}; if (!f.no && !f.dep && !f.arr) return ''; return (k === 'fo' ? '가는 편 ' : '오는 편 ') + [f.no, (f.dep || '?') + '→' + (f.arr || '?')].filter(Boolean).join(' '); }).filter(Boolean).join(' / '); }
function next(s) { const i = INFO.indexOf(s); store.set('gaboja-trip', S.trip); go(i + 1 < INFO.length ? INFO[i + 1] : 'build'); }

/* 달력 */
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const ymd = d => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const fmt = n => { const d = new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100); return `${d.getMonth() + 1}. ${d.getDate()} ${WD[d.getDay()]}`; };
function drawCal() {
  const m = S.calM, tr = S.trip, today = ymd(new Date()), y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1).getDay(), dim = new Date(y, mo + 1, 0).getDate(), now = new Date(), isNow = y === now.getFullYear() && mo === now.getMonth();
  let g = ''; for (let i = 0; i < first; i++) g += '<span></span>';
  for (let d = 1; d <= dim; d++) { const n = y * 10000 + (mo + 1) * 100 + d, c = [];
    if (tr.start && n === tr.start) c.push('s'); if (tr.end && n === tr.end) c.push('e'); if (tr.start && tr.end && n > tr.start && n < tr.end) c.push('in-r');
    g += `<button data-d="${n}" class="${c.join(' ')}" ${n < today ? 'disabled' : ''} aria-pressed="${c.includes('s') || c.includes('e')}" aria-label="${y}년 ${mo + 1}월 ${d}일${c.includes('s') ? ' 출발' : c.includes('e') ? ' 도착' : ''}">${d}</button>`; }
  $('#cal').innerHTML = `<div class="ch"><button class="ib" id="cPrev" aria-label="이전 달" ${isNow ? 'disabled' : ''}>${ICON.l}</button><b>${y}년 ${mo + 1}월</b><button class="ib" id="cNext" aria-label="다음 달">${ICON.r}</button></div>
    <div class="wk">${WD.map(w => `<span>${w}</span>`).join('')}</div><div class="gd">${g}</div>`;
  $('#cPrev').onclick = () => { S.calM = new Date(y, mo - 1, 1); drawCal(); $('#cal .gd').classList.add('swap'); };
  $('#cNext').onclick = () => { S.calM = new Date(y, mo + 1, 1); drawCal(); $('#cal .gd').classList.add('swap'); };
  $('#cal .gd').onclick = e => { const b = e.target.closest('[data-d]'); if (!b || b.disabled) return; const n = +b.dataset.d; tap();
    if (!tr.start || tr.end || n < tr.start) { tr.start = n; tr.end = null; tr.nights = 0; } else if (n === tr.start) { tr.start = null; }
    else { tr.end = n; const a = new Date(Math.floor(tr.start / 10000), Math.floor(tr.start / 100) % 100 - 1, tr.start % 100), b2 = new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100); tr.nights = Math.round((b2 - a) / 864e5); }
    drawCal(); dateSum(); const f = document.querySelector(`#cal [data-d="${n}"]`); if (f) f.focus({ preventScroll: true }); };
}
function dateSum() {
  const tr = S.trip, el = $('#dSum'); if (!el) return;
  document.querySelectorAll('#nights .chip').forEach(c => c.setAttribute('aria-pressed', !tr.start && tr.nights === +c.dataset.n));
  if (tr.start && tr.end) el.innerHTML = `${fmt(tr.start)} → ${fmt(tr.end)} · <span>${tr.nights}박 ${tr.nights + 1}일</span>`;
  else if (tr.start) el.innerHTML = `${fmt(tr.start)} 출발 · <span class="muted">돌아오는 날을 눌러요</span>`;
  else if (tr.nights) el.innerHTML = `날짜 미정 · <span>${NIGHTS.find(x => x[0] === tr.nights)[1]}</span>`;
  else el.innerHTML = '<span class="muted">출발일을 눌러요</span>';
  $('#dNext').disabled = !(tr.nights && (!tr.start || tr.end));
}

let SEND = null; // { st: 'wait'|'ok'|'bad', row, err }
function payload() {
  const tr = S.trip, d = n => n ? `${Math.floor(n / 10000)}-${String(Math.floor(n / 100) % 100).padStart(2, '0')}-${String(n % 100).padStart(2, '0')}` : '';
  return { agree: tr.agree === true, hp: tr.hp || '', nick: (tr.nick || '').trim(), toKind: tr.toKind === 'mail' ? '이메일' : '카카오톡', to: (tr.to || '').trim(),
    type: S.type || '', typeName: S.type ? T(S.type).name : '', votes: S.votes ? JSON.stringify(S.votes) : '',
    answers: S.ans.map((oi, i) => oi == null ? '' : `${i + 1}.${Q[i].o[oi][0]}`).filter(Boolean).join(' / '),
    method: (METHOD.find(m => m[0] === tr.method) || ['', ''])[1], city: tr.city === '다른 곳' ? (tr.cityEtc || '다른 곳') : (tr.city || ''),
    start: d(tr.start), end: d(tr.end), nights: tr.nights || '', who: tr.who || '', homeMode: tr.home ? (tr.homeMode === 'addr' ? '집 주소' : '동네+역') : '', home: tr.home || '',
    flight: tr.flight === 'yes' ? '정함' : '미정', flightTx: isDom(tr) ? flightText(tr) : tr.flight === 'yes' ? (tr.flightTx || '') : '', stay: { no: '미정', area: '동네만', yes: '정함' }[tr.stay] || '', stayTx: tr.stay === 'no' ? '' : (tr.stayTx || ''),
    likes: tr.likes.join(', '), avoid: tr.avoid.join(', '), page: location.origin + location.pathname };
}
function sendNow() {
  SEND = { st: 'wait' }; const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  return fetch(INTAKE, { method: 'POST', body: JSON.stringify(payload()), signal: ctl.signal }) // text/plain → 사전 요청 없이 감
    .then(r => r.json()).then(j => { SEND = j.ok ? { st: 'ok', row: j.row } : { st: 'bad', err: j.err || '저장 실패' }; })
    .catch(e => { SEND = { st: 'bad', err: e.name === 'AbortError' ? '응답이 늦어요' : (/larchive\.page|localhost/.test(location.hostname) ? '인터넷 연결을 확인해 주세요' : '이 미리보기에선 막혀 있어요 · larchive.page 주소에서 신청') }; })
    .finally(() => clearTimeout(to));
}

let PLANNED = null; // 방금 만든 일정 (DEST에 있는 도시만 — 오사카·교토·도쿄, 나머지는 아키가 만들어 보냄)
function buildPlan() {
  const tr = S.trip; PLANNED = null;
  const dest = DEST[tr.city]; if (!dest || !window.GABOJA_GEN || !(window.GABOJA_GEN.dests || ['kix']).includes(dest)) return null;
  const d = n => n ? `${Math.floor(n / 10000)}-${String(Math.floor(n / 100) % 100).padStart(2, '0')}-${String(n % 100).padStart(2, '0')}` : null;
  try { PLANNED = window.GABOJA_GEN.make({ type: S.type, start: d(tr.start), nights: tr.nights || 3, likes: tr.likes, avoid: tr.avoid, flightTx: tr.flight === 'yes' ? tr.flightTx : '', fo: tr.flight === 'yes' ? tr.fo : null, fb: tr.flight === 'yes' ? tr.fb : null, stayTx: tr.stay !== 'no' ? tr.stayTx : '', cityLabel: tr.city, dest, airport: tr.airport || ((AIRPORTS[dest] || [[]])[0] || [])[0], region: tr.region, mode: tr.mode, line: tr.line || 0 }); PLANNED.nick = (tr.nick || '').trim().slice(0, 12); store.set('gaboja-plan', PLANNED); } catch (e) { PLANNED = null; }
  return PLANNED;
}
function rBuild() {
  if (!SEND || SEND.st !== 'ok') sendNow();
  buildPlan();
  setBar('info', INFO.length + 1, INFO.length + 1, { t: '만드는 중' });
  const tr = S.trip, t = S.type ? T(S.type) : null, city = tr.city === '다른 곳' ? (tr.cityEtc || '여행지') : (tr.city || '여행지');
  const lines = [tr.home ? (isDom(tr) ? '집 문 앞에서 ' + (tr.mode === 'air' ? '공항' : tr.mode === 'train' ? '역' : '숙소') + '까지 시간 계산' : '집 문 앞에서 공항까지 시간 계산') : '출발 시각 정하기', `${city}에서 ${t ? t.name + ' 취향' : '취향'}에 맞는 곳 고르기`, '영업시간·휴무일 맞춰 보기', tr.nights ? `${tr.nights + 1}일 동선 짜기` : '하루 동선 짜기', '가이드북 한 권으로 정리'];
  screen(`<div class="calc">
      <span class="eyebrow">${t ? esc(t.name) + ' 맞춤' : '맞춤 일정'}</span>
      ${S.type ? flapsHtml(S.type.split(''), true) : ''}
      <h2 id="cT">내 여행 가이드북 만드는 중</h2>
      <p class="sub3">${esc(city)}${tr.nights ? ` · ${tr.nights}박 ${tr.nights + 1}일` : ''}${tr.who ? ' · ' + esc(tr.who) : ''}</p>
      <div class="meter"><i id="cM"></i></div><span class="pct" id="cP">0%</span>
      <div class="ticks">${lines.map(l => `<div><span class="spin"></span>${ICON.check}<span>${esc(l)}</span></div>`).join('')}</div>
    </div>`);
  const tk = document.querySelectorAll('.ticks div'), STEP = 1050; tk[0].classList.add('cur');
  lines.forEach((_, k) => later(() => { tk[k].classList.remove('cur'); tk[k].classList.add('on'); if (tk[k + 1]) tk[k + 1].classList.add('cur'); const v = (k + 1) / lines.length; $('#cM').style.transform = `scaleX(${v})`; $('#cP').textContent = Math.round(v * 100) + '%'; }, 600 + k * STEP));
  const end = 600 + lines.length * STEP;
  later(() => { const h = $('#cT'); h.textContent = '다 만들었어요!'; h.classList.add('found'); }, end);
  // 연출이 끝나도 전송이 안 끝났으면 조금 더 기다림 (최대 9초)
  const finish = () => { S.hist = S.hist.filter(h => h !== 'build'); go('done', { noHist: true }); };
  later(() => { const t0 = Date.now(); const wait = () => { if (!SEND || SEND.st === 'wait') { if (Date.now() - t0 > 9000) return finish(); $('#cT').textContent = '거의 다 됐어요'; return later(wait, 300); } finish(); }; wait(); }, end + 800);
}

function rDone() {
  setBar('info', INFO.length + 1, INFO.length + 1, { t: '발급 완료' });
  const tr = S.trip, t = S.type ? T(S.type) : null;
  const when = tr.start && tr.end ? `${fmt(tr.start)} → ${fmt(tr.end)}` : (tr.nights ? NIGHTS.find(x => x[0] === tr.nights)[1] + ' · 날짜 미정' : '미정');
  const f = (k, v) => `<div class="row"><span class="tm zone" style="color:var(--sub)">${k}</span><div><b>${esc(v)}</b></div></div>`;
  screen(`
    <article class="ticket">
      <div class="hd"><b>가보자</b><span>BOARDING PASS</span><em>발급 완료</em></div>
      <div class="bd">${S.type ? flapsHtml(S.type.split(''), true) : ''}
        <h1 class="nm">${esc(tr.city === '다른 곳' ? (tr.cityEtc || '다른 곳') : (tr.city || '여행지 미정'))}</h1>
        <p class="ln">${esc(when)}${tr.who ? ' · ' + esc(tr.who) : ''}</p></div>
      <div class="perf"></div>
      <div class="card" style="background:none;border:0;box-shadow:none">
        ${f('유형', t ? t.name : '건너뜀')}
        ${f('일정', (METHOD.find(m => m[0] === tr.method) || METHOD[0])[1])}
        ${f('출발', tr.home ? tr.home : '나중에 입력')}
        ${f(isDom(tr) ? '가는 길' : '예약', [isDom(tr) ? (flightText(tr) || '미정') : tr.flight === 'yes' ? '비행기 ' + (tr.flightTx || '정함') : '비행기 미정', tr.stay === 'no' ? '숙소 미정' : '숙소 ' + (tr.stayTx || (tr.stay === 'area' ? '동네만' : '정함'))].join(' · '))}
        ${f('취향', tr.likes.length ? tr.likes.join(' · ') : '고르지 않음')}
        ${tr.avoid.length ? f('피함', tr.avoid.join(' · ')) : ''}
      </div>
      <div class="barcode" aria-hidden="true">${barcode(S.type || 'GABO')}</div>
    </article>
    ${SEND && SEND.st === 'ok' ? `<div class="sent ok">${ICON.check}<span>신청 접수됨 · 받을 곳 ${esc(tr.to || '')}</span></div>`
      : `<div class="sent bad"><span>신청을 못 보냈어요 (${esc((SEND && SEND.err) || '연결 실패')})</span><button id="reSend">다시 보내기</button></div>`}
    <div class="note">${ICON.lock}<span>${PLANNED ? `방금 만든 ${esc(PLANNED.title)} 일정이 열려요. 시험판이라 아키가 한 번 더 확인한 가이드북을 따로 보내 드려요` : '이 도시는 일정 자동 만들기 준비 중이에요. 가이드북은 아키가 만들어 보내 드리고, 지금은 오사카·교토 샘플 일정이 열려요'}</span></div>
    <div class="foot">
      <a class="cta" href="${PLANNED ? 'index.html' : 'index.html#sample'}" style="text-decoration:none">${PLANNED ? '내 일정 보기' : '샘플 일정 보기'} ${ICON.arrow}</a>
      <button class="ghost" id="dEdit">수정하기</button>
    </div>`);
  $('#dEdit').onclick = () => { S.hist = ['intro', 'method']; go('city', { noHist: true, back: true }); };
  const rs = $('#reSend'); if (rs) rs.onclick = () => { rs.disabled = true; rs.textContent = '보내는 중…'; sendNow().then(() => { dir = 1; render(); }); };
}

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove('on'), 1800); }

/* 키보드: A~D / 1~4로 고르기, Esc = 뒤로 */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (rxOpen() && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const g = $('#rxGo'); if (g) g.click(); return; }
  if (S.step[0] === 'q') { const k = 'abcd1234'.indexOf(e.key.toLowerCase()); if (k >= 0) { const b = document.querySelectorAll('.opt')[k % 4]; if (b) b.click(); } }
  if (e.key === 'Escape' && S.step !== 'intro') back();
});
$('#backBtn').onclick = () => { if (S.step === 'intro') location.href = 'index.html'; else back(); };

/* 주소 #r-LSRP = 그 유형 결과 바로 보기 · #types = 16가지 */
function route() {
  const h = location.hash.slice(1);
  if (/^r-[LH][SE][FR][JP]$/.test(h)) { const c = h.slice(2); if (S.step === 'view' && S.view === c) return; if (S.step === 'result' && S.type === c) return; S.view = c; S.hist = FROM_APP && !S.booted ? [] : ['intro']; go('view', { noHist: true }); return; }
  if (h === 'types') { S.hist = FROM_APP && !S.booted ? [] : ['intro']; go('types', { noHist: true }); return; }
  if (!h && (S.step === 'view' || S.step === 'result')) { back(); return; }
  if (!S.booted) render();
}
window.addEventListener('hashchange', route);
/* 시안 점검용: ?s=q3 · ?s=date 처럼 화면 하나를 바로 열기 (?type=LSRP로 유형 지정) */
const QS = new URLSearchParams(location.search), qsS = QS.get('s'), qsT = QS.get('type');
if (qsT && BASE[qsT]) { S.type = qsT; S.votes = S.votes && S.type === saved?.code ? S.votes : (() => { const v = { L: 0, H: 0, S: 0, E: 0, F: 0, R: 0, J: 0, P: 0 }; qsT.split('').forEach((l, k) => { v[l] = k % 2 ? 3 : 2; const x = AX[k], o = x.a[0] === l ? x.b[0] : x.a[0]; v[o] = 3 - v[l]; }); return v; })(); }
if (qsS && (/^q[0-5]$/.test(qsS) || ['intro', 'result', 'types', 'method', 'done', 'calc', 'build'].concat(INFO).includes(qsS))) {
  if (qsS === 'calc') S.ans = [0, 1, 2, 3, 0, 1];
  if (qsS[0] === 'q') for (let k = 0; k < +qsS[1]; k++) S.ans[k] = (k * 3) % 4;
  if (!S.type && !qsS.startsWith('q') && qsS !== 'intro' && qsS !== 'types') { S.type = 'LSRP'; S.votes = { L: 3, H: 0, S: 2, E: 1, F: 1, R: 2, J: 0, P: 3 }; }
  if (qsS === 'done') Object.assign(S.trip, { city: '오사카·교토', start: 20261204, end: 20261207, nights: 3, who: '친구', home: '올림픽로 300', method: 'auto', likes: ['자연·산책', '카페'] });
  if (qsS === 'build') Object.assign(S.trip, { city: '오사카·교토', nights: 3, who: '친구', home: '올림픽로 300' });
  S.hist = ['intro']; S.step = qsS; render();
  if (qsS[0] === 'q' && QS.get('rx')) { const i = +qsS[1], oi = S.shuffle[i][0]; S.ans[i] = oi; const b = document.querySelector(`.opt[data-oi="${oi}"]`); b.classList.add('chosen'); document.querySelector('#opts').classList.add('done'); busy = true; openRx(i, oi); NAV++; } // 점검용: 반응 시트 열어 둔 채
} else if (location.hash) route(); else render();
S.booted = true;
</script>
</body>
