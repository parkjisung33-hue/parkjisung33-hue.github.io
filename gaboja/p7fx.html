<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>캐릭터 등장 이펙트</title>
<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2"); }
:root { color-scheme: light; --canvas:#EEF0F3; --ink:#15171A; --sub:#6F757D; --hair:rgba(21,23,26,.09); --paper:#FFFFFF; --blue:#3B5BDB; --blue-soft:rgba(59,91,219,.09);
  --kr:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --shadow:0 0.25rem 0.75rem -0.375rem rgba(24,36,60,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --canvas:#0E1013; --ink:#ECEEF1; --sub:#8F969F; --hair:rgba(255,255,255,.08); --paper:#1B1E23; --blue:#8095F5; --blue-soft:rgba(128,149,245,.12); --shadow:none; } }
html { font-size: clamp(13.5px, calc(100vw * 16 / 390), 18px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--kr); -webkit-font-smoothing: antialiased; word-break: keep-all; }
main { max-width: 26rem; margin: 0 auto; padding: 1.25rem 1rem 6rem; }
h1 { font-size: 1.25rem; margin: 0 0 .375rem; } .lead { color: var(--sub); font-size: .875rem; margin: 0 0 1rem; line-height: 1.55; }
.how { font-size: .8125rem; line-height: 1.6; background: var(--blue-soft); border-radius: 1rem; padding: .75rem 1rem; margin-bottom: 1rem; }
.gh { font-size: .8125rem; font-weight: 800; color: var(--sub); margin: 1.75rem 0 .625rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: .625rem; }
.pk { background: var(--paper); border-radius: 1.25rem; padding: .75rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.av { aspect-ratio: 100 / 92; border-radius: .875rem; display: grid; place-items: center; overflow: hidden; cursor: pointer; position: relative; }
.av svg { width: 100%; height: 100%; display: block; }
.av .re { position: absolute; right: .375rem; bottom: .375rem; font: 700 .6875rem var(--kr); color: var(--sub); background: rgba(255,255,255,.8); border-radius: 1rem; padding: .125rem .5rem; }
.nm { font-size: .875rem; font-weight: 800; display: flex; align-items: center; gap: .375rem; }
.chg { font-size: .625rem; font-weight: 800; color: #fff; background: var(--blue); border-radius: 1rem; padding: .0625rem .4375rem; }
.fx { font-size: .75rem; color: var(--sub); line-height: 1.4; min-height: 2.1em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; }
.opts button { border: 0; background: var(--hair); color: var(--ink); font: 700 .71875rem var(--kr); border-radius: .75rem; padding: .4375rem .25rem; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.opts button.w { grid-column: 1 / -1; }
textarea { width: 100%; resize: none; border: 1px solid var(--hair); background: var(--canvas); color: var(--ink); border-radius: .75rem; padding: .375rem .5rem; font: .75rem var(--kr); }
#out { min-height: 8rem; font-size: .8125rem; margin-top: .5rem; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: .625rem 1rem calc(.625rem + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: .75rem; justify-content: center; background: color-mix(in srgb, var(--canvas) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--hair); }
.dock .cnt { font-size: .8125rem; color: var(--sub); } .dock button { border: 0; background: var(--ink); color: var(--paper); font: 800 .9375rem var(--kr); border-radius: 2rem; padding: .75rem 1.5rem; }
.allbtn { border: 0; background: var(--paper); color: var(--ink); font: 700 .8125rem var(--kr); border-radius: 2rem; padding: .5rem 1rem; box-shadow: inset 0 0 0 1px var(--hair); }
.toast { position: fixed; left: 50%; bottom: 5rem; transform: translate(-50%, 1rem); opacity: 0; transition: .25s; background: var(--ink); color: var(--paper); font-size: .8125rem; padding: .5rem 1rem; border-radius: 2rem; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ===== 이펙트 (재생 = .av.play) — 등장할 때 한 번, 1~1.6초, 그 짐만의 동작 ===== */
.av svg [class*="fx-"], .av svg .fx-puff > g { transform-box: fill-box; }   /* 이펙트 조각에만 (transform 속성이 있는 몸통·회전 묶음은 건드리지 않음) */
.av.play .fx-ndl { transform-origin: center; animation: ndl 1.5s cubic-bezier(.2,.75,.25,1) both; }
@keyframes ndl { 0% { transform: rotate(0); } 62% { transform: rotate(570deg); } 78% { transform: rotate(528deg); } 90% { transform: rotate(546deg); } 100% { transform: rotate(540deg); } }
/* 운동화: 좌우로 뒤뚱 + 두 발 번갈아 들기 (걸음) */
.av.play[data-c="LSFP"] .fx-b { transform-origin: 50% 100%; animation: waddle 1.3s ease-in-out both; }
@keyframes waddle { 0%, 100% { transform: none; } 15% { transform: translateX(-2px) rotate(-4deg); } 40% { transform: translateX(2px) rotate(4deg); } 65% { transform: translateX(-1px) rotate(-2.5deg); } 85% { transform: translateX(.5px) rotate(1deg); } }
.av.play .fx-l1 { animation: step 1.3s ease-in-out both; } .av.play .fx-l2 { animation: step 1.3s ease-in-out .25s both; }
@keyframes step { 0%, 50%, 100% { transform: none; } 12% { transform: translateY(-3px); } 62% { transform: translateY(-2px); } 75% { transform: none; } }
/* 이정표: "어느 길로 갈래?" — 팔이 번갈아 은은하게 커졌다 작아짐 */
.av.play .fx-s1 { transform-origin: 0% 50%; animation: ask 1.6s ease-in-out both; }
.av.play .fx-s2 { transform-origin: 100% 50%; animation: ask 1.6s ease-in-out .4s both; }
@keyframes ask { 0%, 50%, 100% { transform: none; } 22% { transform: scale(1.14); } 72% { transform: scale(1.05); } 88% { transform: none; } }
/* 버스: 부르릉(살짝 떨림) + 뒤 배기구 연기 붕 */
.av.play[data-c="LSRP"] .fx-b { animation: rumble 1.3s linear both; }
@keyframes rumble { 0%, 40%, 100% { transform: none; } 8%, 24% { transform: translateY(-1px); } 16%, 32% { transform: translateY(.6px); } 55% { transform: translateX(1.5px); } 75% { transform: translateX(-.5px); } }
.av.play .fx-puff { animation: show 1.6s ease-out both; }
@keyframes show { 0%, 100% { opacity: 0; } 12%, 70% { opacity: 1; } }
.av.play .fx-puff > g { transform-origin: center; animation: puff 1.6s cubic-bezier(.2,.7,.3,1) both; }
.av.play .fx-puff .p2 { animation-delay: .12s; } .av.play .fx-puff .p3 { animation-delay: .24s; }
@keyframes puff { 0% { transform: translate(6px, 3px) scale(.25); opacity: .9; } 60% { opacity: .8; } 100% { transform: translate(-3px, -5px) scale(1.5); opacity: 0; } }

/* 맛집 지도: 지도가 펼쳐지고 핀이 톡 꽂힘 */
.av.play .fx-map { transform-origin: center; animation: unfold .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes unfold { from { transform: scaleX(.12); } to { transform: none; } }
.av.play .fx-pin { animation: pin .7s cubic-bezier(.3,.6,.3,1.4) .4s both; }
@keyframes pin { 0% { transform: translateY(-16px); opacity: 0; } 55% { transform: translateY(1.5px); opacity: 1; } 75% { transform: translateY(-1.5px); } 100% { transform: none; } }
/* 가격표: 매달린 줄에서 흔들 */
.av.play .fx-tag { transform-origin: 23% 50%; animation: swing 1.6s cubic-bezier(.3,.6,.4,1) both; }
@keyframes swing { 0% { transform: rotate(-14deg); } 25% { transform: rotate(9deg); } 45% { transform: rotate(-5deg); } 65% { transform: rotate(2.5deg); } 82% { transform: rotate(-1deg); } 100% { transform: none; } }
/* 쿠폰: 도장이 하나씩 쾅 */
.av.play .fx-st { transform-origin: center; animation: stamp .38s cubic-bezier(.3,.6,.3,1.5) calc(var(--i) * .18s + .1s) both; }
@keyframes stamp { 0% { transform: scale(1.9) rotate(-18deg); opacity: 0; } 70% { transform: scale(.92); opacity: 1; } 100% { transform: none; } }
/* 장바구니: 채소가 쏙 */
.av.play .fx-veg { animation: veg .8s cubic-bezier(.3,.6,.3,1.5) .1s both; }
@keyframes veg { 0% { transform: translateY(-20px); opacity: 0; } 30% { opacity: 1; } 62% { transform: translateY(2px); } 80% { transform: translateY(-1px); } 100% { transform: none; } }
/* 깃발: 종이처럼 휘며 펄럭 — 모양 자체가 바뀜(SVG animate, 재생 때 시작) + 살짝 기울기 */
.av.play .fx-flag { transform-origin: 0% 50%; animation: flagtilt 1.6s ease-in-out both; }
@keyframes flagtilt { 0%, 100% { transform: none; } 25% { transform: rotate(-2deg); } 55% { transform: rotate(1.5deg); } }
/* 스마트폰: 화면 속 핀이 톡 */
.av.play .fx-pin2 { transform-origin: 50% 100%; animation: topin 1.8s ease-in-out both; }
@keyframes topin { 0%, 42% { opacity: 0; transform: scale(.7); } 70% { opacity: 1; transform: scale(1.06); } 85% { transform: scale(.98); } 100% { opacity: 1; transform: none; } }
.av.play .fx-fire { transform-origin: 50% 100%; animation: fire 1.8s ease-in-out both; }
@keyframes fire { 0% { opacity: 0; transform: scale(.2); } 14% { opacity: 1; transform: scale(1.12); } 24% { transform: scale(.95, 1.06); } 34% { transform: scale(1.04, .96); } 44% { opacity: 1; transform: scale(1); } 66% { opacity: 0; transform: scale(.8) translateY(-3px); } 100% { opacity: 0; } }
.av.play[data-c="HSFP"] .fx-b { transform-origin: 50% 100%; animation: tilt 1s ease-out both; }
@keyframes tilt { 0% { transform: rotate(-4deg); } 50% { transform: rotate(2deg); } 100% { transform: none; } }
/* 카메라: 찰칵 (렌즈 조였다 펴짐 + 플래시) */
.av.play .fx-lens { transform-origin: center; animation: snap .55s cubic-bezier(.3,.6,.3,1.4) .25s both; }
@keyframes snap { 0% { transform: none; } 40% { transform: scale(.82); } 100% { transform: none; } }
.av.play .fx-flash { animation: flash .7s ease-out .35s both; }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
/* 쌍안경: 들어 올리고 렌즈에 빛이 스침 */
.av.play[data-c="HSRP"] .fx-b { transform-origin: 50% 100%; animation: lift 1.4s ease-in-out both; }
@keyframes lift { 0%, 100% { transform: none; } 20% { transform: translateX(-3px) rotate(-4deg); } 50% { transform: translateX(3px) rotate(4deg); } 75% { transform: translateX(-1px) rotate(-1.5deg); } }
.av.play .fx-gl { animation: glint .9s ease-out .9s both; } .av.play .fx-gl.g2 { animation-delay: 1s; }
@keyframes glint { 0% { transform: translate(-6px, 6px); opacity: 0; } 50% { transform: translate(3px, -3px); opacity: 1; } 100% { transform: none; opacity: 1; } }
/* 라멘: 젓가락이 쏙 들어갔다 나오고 김이 피어오름 */
.av.play .fx-chop { animation: dip 1.2s ease-in-out both; }
@keyframes dip { 0%, 100% { transform: none; } 30% { transform: translate(-2px, 5px); } 55% { transform: translate(1px, -3px); } 75% { transform: translate(0, 1px); } }
.av.play .fx-steam2 { animation: steam 1.6s ease-out .3s both; }
@keyframes steam { 0% { opacity: 0; transform: translateY(5px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
/* 쇼핑백: 통통 + 반짝 */
.av.play[data-c="HEFP"] .fx-b { transform-origin: 50% 100%; animation: squash .9s cubic-bezier(.3,.6,.3,1.3) both; }
@keyframes squash { 0% { transform: scale(1.08, .86); } 45% { transform: scale(.96, 1.05); } 75% { transform: scale(1.02, .98); } 100% { transform: none; } }
.av.play .fx-pop { animation: peek 1.3s cubic-bezier(.3,.6,.3,1.3) .2s both; }
@keyframes peek { 0%, 100% { transform: none; } 35%, 60% { transform: translateY(-15px) rotate(-6deg); } 48% { transform: translateY(-15px) rotate(5deg); } 85% { transform: translateY(1px); } }
/* 호텔 침대: zZ가 둥실 */
.av.play .fx-z1 { animation: zz 1.2s ease-out .1s both; } .av.play .fx-z2 { animation: zz 1.2s ease-out .45s both; }
@keyframes zz { 0% { opacity: 0; transform: translate(-4px, 6px) scale(.6); } 60% { opacity: 1; transform: translate(1px, -2px); } 100% { opacity: 1; transform: none; } }
/* 커피잔: 김이 하나씩 피어오름 */
.av.play .fx-sm { animation: rise 1.1s ease-out calc(var(--i) * .18s + .1s) both; }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 70% { opacity: 1; transform: translateY(-1.5px); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .av.play * { animation: none !important; } }
body.frame .how, body.frame .opts, body.frame .pk textarea, body.frame .fx, body.frame .re, body.frame .dock, body.frame h1, body.frame .lead, body.frame #out, body.frame main > h2 { display: none; }
body.frame main { padding: 0; } body.frame .nm { display: none; } body.frame .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; } body.frame .pk { padding: 2px; border-radius: 0; } body.frame .gh { margin: .25rem 0; }
</style>
</head>
<body>
<main>
<h1>캐릭터 등장 이펙트 · 16개 (3차)</h1>
<p class="lead">2차 피드백 4개를 고쳤어요(파란 <b>수정</b> 표시). 나머지는 2차 그대로예요. 아래서 뿅 나오는 대신, 그 짐만 할 수 있는 작은 동작 하나씩. 화면에 보이면 한 번 재생되고(1~1.6초), 그림을 누르면 다시 봐요.</p>
<div class="how">① 카드마다 <b>좋아요 / 더 은은하게 / 더 크게 / 다른 동작</b> 중 하나<br>② 하고 싶은 말은 메모 칸에<br>③ 맨 아래 <b>답 복사</b> → 채팅에 붙여넣기<br><button class="allbtn" id="all">전체 다시 재생</button></div>
<div id="board"></div>
<h2 style="margin-top:2.5rem;font-size:1rem">보낼 답 (미리 보기)</h2>
<textarea id="out" readonly></textarea>
</main>
<div class="dock"><span class="cnt"><b id="cn">0</b>/16 고름</span><button id="cp">답 복사</button></div>
<div class="toast" id="tt">복사했어요 · 채팅에 붙여넣기</div>
<script src="chars.js?v=20261118d"></script>
<script src="types.js"></script>
<script>
(() => {
  const FX = { LSFJ: '나침반 바늘이 휘리릭 돌다가 북쪽에서 멈춤', LSFP: '좌우로 뒤뚱, 두 발을 번갈아 들며 걸음', LSRJ: '“어느 길로 갈래?” 두 팔이 번갈아 커졌다 작아짐', LSRP: '부르릉 떨리고 뒤 배기구에서 뭉게 연기 붕',
    LEFJ: '접힌 지도가 펼쳐지고 핀이 톡 꽂힘', LEFP: '매달린 가격표가 흔들흔들', LERJ: '쿠폰 도장이 하나씩 쾅쾅', LERP: '채소가 위에서 장바구니 안으로 쏙',
    HSFJ: '깃발이 종이처럼 휘며 펄럭', HSFP: '불꽃이 톡 나타났다가 사르륵 핀으로 바뀜', HSRJ: '렌즈가 찰칵 조였다 펴지고 플래시', HSRP: '좌우로 두리번, 렌즈에 둥근 빛이 스침',
    HEFJ: '젓가락이 쏙 들어갔다 나오고 김이 모락', HEFP: '쇼핑백이 통통, 선물 상자가 빼꼼', HERJ: 'zZ가 하나씩 둥실', HERP: '커피 김이 하나씩 피어오름' };
  const GN = ['로컬 탐험형', '취향 수집형', '명소 정복형', '힐링 충전형'], CODES = Object.keys(FX), OPT = ['좋아요', '더 은은하게', '더 크게', '다른 동작'];
  const KEY = 'gaboja-fb-p7fx3', CHG = ['LSRP','LERP','HSFP','HSRP'], $ = q => document.querySelector(q), all = q => [...document.querySelectorAll(q)];
  let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
  const nameOf = c => (window.GABOJA_TYPES && GABOJA_TYPES[c] && GABOJA_TYPES[c].name) || c;
  let h = '';
  CODES.forEach((c, i) => {
    if (i % 4 === 0) h += (i ? '</div>' : '') + `<div class="gh">${GN[i / 4]}</div><div class="grid">`;
    h += `<div class="pk" data-q="${c}"><div class="av" data-c="${c}" style="background:${GABOJA_CHAR_BG(c)}">${GABOJA_CHAR(c, { bg: false })}<span class="re">↻</span></div>
      <div class="nm">${nameOf(c)}${CHG.includes(c) ? '<span class="chg">수정</span>' : ''}</div><div class="fx">${FX[c]}</div>
      <div class="opts">${OPT.map(o => `<button data-v="${o}">${o}</button>`).join('')}</div>
      <textarea rows="1" placeholder="메모 (선택)"></textarea></div>`;
  });
  $('#board').innerHTML = h + '</div>';
  const play = av => { av.classList.remove('play'); void av.offsetWidth; av.classList.add('play'); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) av.querySelectorAll('animate').forEach(m => { try { m.beginElement(); } catch (_) {} }); };
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { play(e.target); io.unobserve(e.target); } }), { threshold: .6 });
  all('.av').forEach(av => { io.observe(av); av.onclick = () => play(av); });
  $('#all').onclick = () => all('.av').forEach((av, i) => setTimeout(() => play(av), i * 60));
  function draw() {
    let n = 0; const lines = ['캐릭터 이펙트 피드백'];
    CODES.forEach(c => { const o = st[c] || {}; if (o.v) n++;
      const p = document.querySelector(`.pk[data-q="${c}"]`); p.querySelectorAll('.opts button').forEach(b => b.setAttribute('aria-pressed', o.v === b.dataset.v));
      const t = p.querySelector('textarea'); if (document.activeElement !== t) t.value = o.m || '';
      lines.push(`${c} ${nameOf(c)}: ${o.v || '(안 고름)'}${o.m && o.m.trim() ? ' · 메모: ' + o.m.trim() : ''}`); });
    $('#cn').textContent = n; $('#out').value = lines.join('\n');
  }
  document.addEventListener('click', e => { const b = e.target.closest('.opts button'); if (!b) return; const c = b.closest('.pk').dataset.q, o = st[c] = st[c] || {}; o.v = o.v === b.dataset.v ? '' : b.dataset.v; save(); draw(); });
  all('.pk textarea').forEach(t => t.addEventListener('input', () => { const c = t.closest('.pk').dataset.q; (st[c] = st[c] || {}).m = t.value; save(); draw(); }));
  $('#cp').onclick = async () => { const tx = $('#out').value; let ok = false;
    try { await navigator.clipboard.writeText(tx); ok = true; } catch (_) { const o = $('#out'); o.removeAttribute('readonly'); o.select(); try { ok = document.execCommand('copy'); } catch (_) {} o.setAttribute('readonly', ''); }
    const t = $('#tt'); t.textContent = ok ? '복사했어요 · 채팅에 붙여넣기' : '위 글을 길게 눌러 복사해 주세요'; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); };
  draw();
  // 점검용: ?t=밀리초 → 모든 이펙트를 그 순간에 멈춰서 보여 줌
  const T = +new URLSearchParams(location.search).get('t');
  if (T >= 0 && location.search.includes('t=')) { document.body.classList.add('frame'); all('.av').forEach(av => { play(av); }); document.getAnimations().forEach(a => { a.pause(); a.currentTime = T; }); all('.av svg').forEach(x => { try { x.pauseAnimations(); x.setCurrentTime(T / 1000); } catch (_) {} }); }
})();
</script>
</body>
</html>
