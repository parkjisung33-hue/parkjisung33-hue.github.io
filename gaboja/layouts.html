<head>

<body>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* 지도 레이아웃 시안 3종 (2026-11-12) — 위 A·B·C로 바꿔 봄
   A 카드 지도  (kimhaggie 도쿄 노트): 지도를 둥근 카드로 일정 사이에 넣고, 아래 번호 칩. 탑승권 → 제목 밑 한 줄 '여행 띠'
   B 시트 지도  (Wanderlog · 카카오맵): 지도가 화면 전체 뒤에, 일정 시트가 손잡이와 함께 올라옴. 지도 아래쪽은 시트 쪽으로 흐려짐.
                탑승권 → 비행기 일정 칸 자체가 탑승권 모양(절취선)
   C 아치 지도  : 지도 아래 끝을 아치(둥근 곡선)로 깎아 시트가 지도를 감싸듯. 탑승권 → 여행 진행 막대(D-day · 4일 중 오늘)
   공통: 오늘 갈 곳 전부 번호 핀 · 지금 = 파란 pulse · 지난 곳 회색 · '내 위치' 버튼(폰 위치 실시간, 허용 필요)
   지도 = MapLibre 4.7.1 + OpenFreeMap(무료·키 없음). 구글로 하려면 Maps JavaScript API 필요 — 시안은 핀·내 위치를 지금 바로 보여 주려고 이걸로 */
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap;
  src: local("Pretendard Variable"), url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2"); }
:root { color-scheme: light;
  --canvas: #EEF0F3; --ink: #15171A; --sub: #6F757D; --hair: rgba(21,23,26,.09); --on-ink: #fff; --paper: #fff; --sheet: rgba(255,255,255,.97);
  --glass: rgba(255,255,255,.78); --red: #E0453A; --blue: #3B5BDB; --past: #B9BEC6;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(24,36,60,.32), 0 2px 0.375rem -2px rgba(24,36,60,.10);
  --kr: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
  --canvas: #0E1013; --ink: #ECEEF1; --sub: #8F969F; --hair: rgba(255,255,255,.08); --on-ink: #0E1013; --paper: #1B1E23; --sheet: rgba(24,27,31,.97);
  --glass: rgba(30,33,38,.8); --red: #F2675D; --blue: #8095F5; --past: #4A5059; } }
html { font-size: clamp(13.5px, calc(100vw * 16 / 390), 18px); -webkit-text-size-adjust: 100%; background: var(--canvas); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--kr); font-size: 0.9375rem; line-height: 1.5; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
.one { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(1.25rem) saturate(1.5); backdrop-filter: blur(1.25rem) saturate(1.5); border: 1px solid rgba(255,255,255,.55); box-shadow: var(--shadow); }
.maplibregl-ctrl-attrib { font-size: 10px; }

/* 위: 알약 바(제목 + 시안 A/B/C) + DAY 말풍선 — 모든 시안 공통, 화면 위에 고정 */
.top { position: fixed; z-index: 20; left: 0; right: 0; top: 0; max-width: 27.5rem; margin: 0 auto; pointer-events: none;
  padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1rem 0.375rem; display: flex; flex-direction: column; gap: 0.5rem; }
.top > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 0.5rem; height: 3.25rem; padding: 0 0.375rem 0 1.125rem; border-radius: 999px; }
.pill .ttl { flex: 1; min-width: 0; line-height: 1.3; }
.pill b { font-size: 0.9375rem; font-weight: 700; }
.pill span.sub { font-size: 0.71875rem; color: var(--sub); }
.vsw { display: flex; padding: 0.1875rem; border-radius: 999px; background: var(--hair); flex: none; }
.vsw button { min-width: 2.25rem; height: 2.25rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 800; color: var(--sub); }
.vsw button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.days { display: flex; gap: 0.375rem; overflow-x: auto; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: none; height: 2.25rem; padding: 0 0.875rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 700; white-space: nowrap;
  background: var(--glass); -webkit-backdrop-filter: blur(1rem); backdrop-filter: blur(1rem); box-shadow: 0 2px 0.5rem rgba(0,0,0,.12); }
.days button span { color: var(--sub); font-weight: 500; margin-left: 0.25rem; }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.days button[aria-pressed="true"] span { color: inherit; opacity: .7; }
/* 시트가 말풍선 밑으로 올라오면 말풍선 뒤에 시트색 */
body.under .top::before { content: ""; position: absolute; inset: 0 0 -1rem; z-index: -1; background: linear-gradient(var(--sheet) 70%, transparent); }

/* 지도 공통 */
#map { position: relative; width: 100%; height: 100%; }
.mapwrap { position: fixed; left: 0; right: 0; top: 0; height: 100svh; z-index: 0; }
.mk { min-width: 1.75rem; height: 1.75rem; padding: 0 0.375rem; border-radius: 999px; background: var(--ink); color: var(--on-ink); border: 2px solid var(--paper);
  display: grid; place-items: center; font-size: 0.78125rem; font-weight: 800; box-shadow: 0 2px 0.375rem rgba(0,0,0,.3); cursor: pointer; transition: transform .15s; }
.mk.past { background: var(--past); color: #fff; }
.mk.now { background: var(--blue); color: #fff; animation: mkpulse 1.8s ease-out infinite; }
.mk.sel { transform: scale(1.25); }
@keyframes mkpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 55%, transparent), 0 2px 0.375rem rgba(0,0,0,.3); } 100% { box-shadow: 0 0 0 0.875rem transparent, 0 2px 0.375rem rgba(0,0,0,.3); } }
/* 내 위치 = 파란 점 + 정확도 원 */
.me { width: 1.125rem; height: 1.125rem; border-radius: 50%; background: #1A73E8; border: 3px solid #fff; box-shadow: 0 0 0 0.375rem rgba(26,115,232,.22), 0 1px 4px rgba(0,0,0,.35); }
.mapbtns { position: absolute; right: 0.875rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 3; }
.mapbtns button { width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; }
.mapbtns svg { width: 1.25rem; height: 1.25rem; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mapbtns .on { background: #1A73E8; color: #fff; border-color: #1A73E8; }

/* 시트(일정) 공통 */
.sheet { position: relative; z-index: 2; background: var(--sheet); }
.inner { max-width: 27.5rem; margin: 0 auto; padding: 0 1rem calc(3rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 0.875rem; }
.r1 { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--sub); }
.dchip { background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 2px 0.5625rem; font-weight: 500; letter-spacing: .04em; }
h2 { margin: 0; font-size: 1.3125rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.3; }
.nowbar { display: flex; align-items: center; gap: 0.5rem; height: 2.75rem; padding: 0 1rem; border-radius: 999px; width: 100%; text-align: left; font-size: 0.8125rem; white-space: nowrap;
  background: color-mix(in srgb, var(--blue) 7%, var(--paper)); border: 1px solid color-mix(in srgb, var(--blue) 14%, transparent); }
.nowbar .pulse { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--blue); flex: none; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 50%, transparent); } 100% { box-shadow: 0 0 0 0.5rem transparent; } }
.nowbar b { color: var(--blue); flex: none; }
.nowbar .cur { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nowbar .nx { margin-left: auto; color: var(--sub); font-size: 0.75rem; flex: none; }
.li { display: grid; grid-template-columns: 3rem 1.75rem minmax(0,1fr) auto; gap: 0 0.5rem; align-items: center; padding: 0.625rem 0; border-top: 1px solid var(--hair); width: 100%; text-align: left; }
.list > :first-child { border-top: 0; }
.li .tm { font-size: 0.875rem; font-weight: 500; }
.li .no { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--ink); color: var(--on-ink); font-size: 0.6875rem; font-weight: 800; display: grid; place-items: center; }
.li .no.none { background: transparent; border: 1.5px dashed var(--hair); color: var(--sub); }
.li.past { opacity: .5; } .li.past .no { background: var(--past); color: #fff; }
.li.now .no { background: var(--blue); color: #fff; }
.li.now { box-shadow: 0 0 0 1.5px var(--blue); border-radius: 0.75rem; animation: glow 1.8s ease-out infinite; padding-inline: 0.375rem; margin-inline: -0.375rem; width: calc(100% + 0.75rem); }
@keyframes glow { 0% { box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 1.5px color-mix(in srgb, var(--blue) 45%, transparent); } 100% { box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 0.5625rem transparent; } }
.li .nm { font-size: 0.90625rem; font-weight: 700; }
.li .s { font-size: 0.75rem; color: var(--sub); }
.li .go { font-size: 0.78125rem; font-weight: 700; color: var(--blue); text-decoration: none; padding: 0.375rem 0 0.375rem 0.25rem; }
.li.m { grid-template-columns: 3rem minmax(0,1fr); font-size: 0.78125rem; color: var(--sub); padding-block: 0.375rem; }
.li.flash { background: color-mix(in srgb, var(--blue) 12%, transparent); border-radius: 0.75rem; }
/* 비행기 칸 (B: 탑승권 모양 / A·C: 보통 칸) */
.fly { display: none; }
.note { font-size: 0.75rem; color: var(--sub); line-height: 1.55; padding: 0 0.25rem; }

/* ===== A 카드 지도 ===== */
body[data-v="A"] .mapwrap { position: relative; height: 15rem; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 0.5rem 1.5rem -0.75rem rgba(24,36,60,.35); border: 1px solid var(--hair); }
body[data-v="A"] .sheet { background: transparent; padding-top: calc(var(--topH, 8.5rem) + 0.25rem); }
body[data-v="A"] .mapbtns { bottom: 0.75rem; }
body[data-v="A"] .grab, body[data-v="A"] .prog { display: none; }
.strip { display: none; }
body[data-v="A"] .strip { display: flex; align-items: stretch; border-radius: 1rem; overflow: hidden; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.06); font-size: 0.8125rem; }
.strip > div { padding: 0.5rem 0.875rem; display: flex; flex-direction: column; justify-content: center; }
.strip .a { flex: 1; min-width: 0; }
.strip .a b { font-size: 0.9375rem; letter-spacing: .02em; }
.strip .a span { color: var(--sub); font-size: 0.71875rem; }
.strip .b { border-left: 2px dashed var(--hair); text-align: center; color: var(--red); font-weight: 800; min-width: 4.5rem; position: relative; }
.strip .b small { display: block; color: var(--sub); font-weight: 500; font-size: 0.6875rem; }
.chipsN { display: none; }
body[data-v="A"] .chipsN { display: flex; gap: 0.375rem; flex-wrap: wrap; }
.chipsN button { display: inline-flex; align-items: center; gap: 0.375rem; height: 2rem; padding: 0 0.75rem 0 0.25rem; border-radius: 999px; background: var(--paper); border: 1px solid var(--hair); font-size: 0.78125rem; font-weight: 600; }
.chipsN i { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--ink); color: var(--on-ink); font-style: normal; font-size: 0.6875rem; font-weight: 800; display: grid; place-items: center; }
.chipsN .past i { background: var(--past); } .chipsN .now i { background: var(--blue); }
body[data-v="A"] .list { background: var(--paper); border-radius: 1.25rem; padding: 0.25rem 0.875rem; }

/* ===== B 시트 지도 ===== */
body[data-v="B"] .sheet { margin-top: 52svh; border-radius: 1.75rem 1.75rem 0 0; box-shadow: 0 -0.75rem 2rem -1rem rgba(0,0,0,.28); min-height: 60svh; }
/* 지도 아래쪽이 시트 쪽으로 흐려짐 → 네모로 뚝 끊기지 않게 */
body[data-v="B"] .mapwrap::after { content: ""; position: absolute; left: 0; right: 0; top: calc(52svh - 5rem); height: 6rem; pointer-events: none; z-index: 1;
  background: linear-gradient(transparent, color-mix(in srgb, var(--sheet) 70%, transparent)); }
body[data-v="B"] .mapbtns { top: calc(52svh - 7.5rem); }
.grab { display: none; }
body[data-v="B"] .grab, body[data-v="C"] .grab { display: block; width: 2.5rem; height: 0.3125rem; border-radius: 0.3125rem; background: var(--sub); opacity: .35; margin: 0.625rem auto 0.125rem; }
body[data-v="B"] .fly { display: grid; }
body[data-v="B"] .li.flyrow { display: none; }
.fly { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 0.5rem; padding: 0.875rem 1.125rem; margin: 0.375rem 0; border-radius: 1rem; position: relative;
  background: var(--ink); color: var(--on-ink); }
.fly::before, .fly::after { content: ""; position: absolute; top: 50%; width: 1rem; height: 1rem; margin-top: -0.5rem; border-radius: 50%; background: var(--sheet); }
.fly::before { left: -0.5rem; } .fly::after { right: -0.5rem; }
.fly .c { font-size: 1.375rem; font-weight: 600; letter-spacing: .04em; line-height: 1; }
.fly .c small { display: block; font-size: 0.6875rem; font-weight: 500; opacity: .65; letter-spacing: 0; margin-top: 0.25rem; }
.fly .to { text-align: right; }
.fly .mid { text-align: center; font-size: 0.6875rem; opacity: .75; border-top: 1.5px dashed rgba(255,255,255,.35); padding-top: 0.25rem; }
.fly .mid b { display: block; font-size: 0.875rem; color: #fff; opacity: 1; }
.fly.past { opacity: .45; }

/* ===== C 아치 지도 ===== */
body[data-v="C"] .mapwrap { height: 58svh; }
body[data-v="C"] .sheet { margin-top: 50svh; min-height: 60svh;
  /* 위 끝을 아치로: 가운데가 높고 양 끝이 내려감 */
  border-top-left-radius: 50% 3.5rem; border-top-right-radius: 50% 3.5rem; box-shadow: 0 -1rem 2rem -1.25rem rgba(0,0,0,.3); padding-top: 0.5rem; }
body[data-v="C"] .mapbtns { top: calc(50svh - 7rem); }
.prog { display: none; }
body[data-v="C"] .prog { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem 1rem; border-radius: 1.125rem; background: var(--canvas); }
.prog .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; color: var(--sub); }
.prog .t b { font-size: 0.9375rem; color: var(--ink); }
.prog .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.25rem; }
.prog .bar i { height: 0.375rem; border-radius: 0.375rem; background: var(--hair); }
.prog .bar i.on { background: var(--blue); }
.prog .bar i.done { background: var(--ink); }
.prog .lbl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.25rem; font-size: 0.6875rem; color: var(--sub); }
.prog .lbl span:nth-child(1) { color: var(--blue); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(21,23,26,.92); color: #fff; padding: 0.625rem 1.125rem; border-radius: 999px; font-size: 0.84375rem; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: calc(100% - 2rem); overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; }
</style>

<div class="top" id="top">
  <div class="pill glass"><div class="ttl"><b class="one">오사카·교토 3박 4일</b><span class="sub one" id="vname">시안 A · 카드 지도</span></div>
    <div class="vsw" id="vsw" role="group" aria-label="시안 고르기"><button data-v="A" aria-pressed="true">A</button><button data-v="B" aria-pressed="false">B</button><button data-v="C" aria-pressed="false">C</button></div></div>
  <div class="days" id="days" role="group" aria-label="날짜 고르기"></div>
</div>
<div class="mapwrap" id="mapwrap"><div id="map" aria-label="오늘 갈 곳 지도"></div>
  <div class="mapbtns" id="mapbtns">
    <button class="glass" id="meBtn" aria-label="내 위치 보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button class="glass" id="fitBtn" aria-label="오늘 갈 곳 한눈에"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<section class="sheet" id="sheet"><div class="grab"></div><div class="inner" id="inner"></div></section>
<div class="toast" id="toast"></div>

<script>
// 좌표 = 장소 DB(places.json, Overture). 숙소·하나미코지는 좌표가 없어 목록에만
const PL = {
  kix: [135.244173, 34.435027, '関西国際空港'], namba: [135.501634, 34.663481, 'なんば駅'], wanaka: [135.503456, 34.665183, 'わなか 千日前本店'],
  doton: [135.501295, 34.669043, '戎橋'], fuku: [135.504566, 34.665601, '福太郎 本店 千日前'], kukuru: [135.500861, 34.668779, 'くくる 道頓堀本店'],
  kiyo: [135.784556, 34.994804, '清水寺'], sannen: [135.780845, 34.99625, '三年坂'], tsujiri: [135.774501, 35.00364, '茶寮都路里 祇園本店'],
  keibun: [135.784829, 35.04395, '恵文社 一乗寺店'], delta: [135.771737, 35.02947, '鴨川デルタ']
};
const DAYS = [
 { no: 1, date: '12. 4 금', title: '도착하자마자 도톤보리', items: [
   { s: '09:00', e: '10:50', fly: ['ICN', '인천', 'KIX', '간사이', '1시간 50분'] },
   { s: '10:50', e: '11:50', n: '간사이공항 도착', sub: '입국 심사 → 南海 なんば 표지판', p: 'kix' },
   { s: '11:50', e: '12:30', m: '난카이 라피트 · 35분' },
   { s: '12:30', e: '13:00', n: '난바 · 숙소에 짐 맡기기', sub: '체크인 전 짐만 보관', p: 'namba' },
   { s: '13:00', e: '14:00', n: '와나카 센니치마에 본점', sub: '타코야키 · 전날 전화', p: 'wanaka' },
   { s: '14:00', e: '15:30', n: '도톤보리 산책', sub: '글리코 간판 사진', p: 'doton' },
   { s: '15:30', e: '17:00', n: '숙소 체크인 · 휴식', sub: '숙소 위치 미정 · 지도 표시 없음' },
   { s: '17:00', e: '18:30', n: '후쿠타로 본점', sub: '오코노미야키 · 17:00 개점', p: 'fuku' },
   { s: '18:30', e: '21:00', n: '도톤보리 야경', sub: '에비스바시 다리 산책', p: 'doton' } ] },
 { no: 2, date: '12. 5 토', title: '교토 — 기요미즈데라와 말차', items: [
   { s: '07:40', e: '09:20', m: '전철 · 걸어서 오르막' },
   { s: '09:20', e: '11:00', n: '기요미즈데라', sub: '나무 무대 전망', p: 'kiyo' },
   { s: '11:00', e: '12:00', n: '산넨자카 · 니넨자카', sub: '돌계단 옛 거리', p: 'sannen' },
   { s: '13:30', e: '15:00', n: '사료 츠지리 기온 본점', sub: '말차 파르페', p: 'tsujiri' },
   { s: '15:00', e: '16:00', n: '기온 하나미코지', sub: '장소 DB에 좌표 없음' },
   { s: '18:30', e: '20:00', n: '쿠쿠루 도톤보리 본점', sub: '저녁 · 오사카로 돌아와서', p: 'kukuru' } ] },
 { no: 3, date: '12. 6 일', title: '교토 서점과 강변', items: [
   { s: '11:00', e: '12:30', n: '게이분샤 이치조지점', sub: '꼭 방문', p: 'keibun' },
   { s: '14:00', e: '15:30', n: '가모강 델타', sub: '징검다리 건너기', p: 'delta' },
   { s: '18:30', e: '20:30', n: '마지막 밤 — 난바', sub: '자유', p: 'namba' } ] },
 { no: 4, date: '12. 7 월', title: '돌아가는 날', items: [
   { s: '10:30', e: '12:00', n: '브런치 — 난바', p: 'namba' },
   { s: '12:00', e: '12:40', m: '난카이 라피트 · 35분' },
   { s: '12:40', e: '15:00', n: '간사이공항 · 체크인', sub: '13:00까지 도착', p: 'kix' },
   { s: '15:00', e: '16:50', fly: ['KIX', '간사이', 'ICN', '인천', '1시간 50분'] } ] }
];
const NOW = { day: 0, min: 13 * 60 + 52 };   // 시안용 가상 시각 (앱과 같음)
const VN = { A: '시안 A · 카드 지도', B: '시안 B · 시트 지도', C: '시안 C · 아치 지도' };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const MW = document.getElementById('mapwrap');   // 지도 상자(A에선 일정 사이로 옮김)
let day = 0, V = 'A', map, ready = false, markers = [], meMk = null, watch = null, meFirst = true;
try { const v = localStorage.getItem('gaboja-mapv'); if (VN[v]) V = v; } catch (_) {}

function model(d) {
  const today = day === NOW.day; let n = 0;
  d.items.forEach(it => { if (it.m) return; if (!it.fly) it.no = ++n;
    it.state = !today ? '' : toMin(it.e) <= NOW.min ? 'past' : toMin(it.s) <= NOW.min ? 'now' : ''; });
  const groups = [];
  d.items.filter(i => i.p).forEach(it => { let g = groups.find(x => x.p === it.p); if (!g) groups.push(g = { p: it.p, its: [] }); g.its.push(it); });
  groups.forEach(g => { g.state = g.its.some(i => i.state === 'now') ? 'now' : g.its.every(i => i.state === 'past') ? 'past' : ''; });
  return { items: d.items, groups, cur: d.items.find(i => i.state === 'now' && !i.fly), next: d.items.find(i => !i.m && !i.fly && today && toMin(i.s) > NOW.min) };
}
const flyCard = it => '<div class="fly ' + (it.state || '') + '"><div class="c">' + it.fly[0] + '<small>' + it.fly[1] + ' · ' + it.s + '</small></div><div class="mid"><b>✈</b>' + it.fly[4] + '</div><div class="c to">' + it.fly[2] + '<small>' + it.fly[3] + ' · ' + it.e + '</small></div></div>';
function render() {
  const d = DAYS[day], M = model(d);
  document.body.dataset.v = V; $('#vname').textContent = VN[V];
  document.querySelectorAll('#vsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === V));
  $('#days').innerHTML = DAYS.map((x, i) => '<button aria-pressed="' + (i === day) + '" data-d="' + i + '">DAY ' + x.no + '<span>' + x.date.slice(0, 5) + '</span></button>').join('');
  let h = '';
  // A: 탑승권 → 여행 띠 한 줄
  h += '<div class="strip"><div class="a"><b>ICN → KIX</b><span>12. 4 금 – 12. 7 월 · 집에서 집까지</span></div><div class="b">D-22<small>3박 4일</small></div></div>';
  // C: 탑승권 → 여행 진행 막대
  h += '<div class="prog"><div class="t"><span>여행 진행 · 오늘 DAY 1</span><b>4일 중 1일째</b></div><div class="bar">' + DAYS.map((x, i) => '<i class="' + (i < NOW.day ? 'done' : i === NOW.day ? 'on' : '') + '"></i>').join('') + '</div>'
    + '<div class="lbl">' + DAYS.map(x => '<span>' + x.date.slice(0, 5) + '</span>').join('') + '</div></div>';
  h += '<div class="r1"><span class="dchip">DAY ' + d.no + '</span><span>' + d.date + '</span></div><h2 class="one">' + esc(d.title) + '</h2>';
  if (day === NOW.day) h += '<button class="nowbar" data-go="' + (M.cur ? M.cur.no : '') + '"><i class="pulse"></i><b>지금 13:52</b><span class="cur">' + esc(M.cur ? M.cur.n : '이동 중') + '</span>' + (M.next ? '<span class="nx">다음 ' + M.next.s + ' ' + esc(M.next.n.split(' ')[0]) + '</span>' : '') + '</button>';
  h += '<div id="mapslot"></div>';
  h += '<div class="chipsN">' + M.items.filter(i => i.p && !i.fly).map(i => '<button class="' + i.state + '" data-no="' + i.no + '"><i>' + i.no + '</i>' + esc(i.n.split(' — ')[0].split(' · ')[0]) + '</button>').join('') + '</div>';
  h += '<div class="list">' + M.items.map(it => it.fly ? flyCard(it) + '<div class="li flyrow ' + it.state + '"><span class="tm">' + it.s + '</span><span class="no none">✈</span><span style="min-width:0"><span class="nm one">비행기 · ' + it.fly[1] + ' → ' + it.fly[3] + '</span><span class="s one">' + it.fly[4] + ' · 도착 ' + it.e + '</span></span><span></span></div>'
    : it.m ? '<div class="li m"><span>' + it.s + '</span><span class="one">' + esc(it.m) + '</span></div>'
    : '<button class="li ' + it.state + '" data-no="' + it.no + '"><span class="tm">' + it.s + '</span><span class="no' + (it.p ? '' : ' none') + '">' + it.no + '</span>'
      + '<span style="min-width:0"><span class="nm one">' + esc(it.n) + '</span>' + (it.sub ? '<span class="s one">' + esc(it.sub) + '</span>' : '') + '</span>'
      + (it.p ? '<a class="go" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(PL[it.p][2]) + '" target="_blank" rel="noopener">지도</a>' : '<span></span>') + '</button>').join('') + '</div>';
  h += '<p class="note">시안 메모 · ' + ({ A: 'A = 지도를 일정 사이의 둥근 카드로(kimhaggie 도쿄 노트). 아래 번호 칩 = 지도 핀 번호. 탑승권은 제목 밑 한 줄 여행 띠로.', B: 'B = 지도가 화면 전체 뒤에 깔리고 일정 시트가 손잡이와 함께 덮음(Wanderlog·카카오맵). 지도 아래쪽은 시트 쪽으로 흐려짐. 탑승권은 비행기 일정 칸이 탑승권 모양으로.', C: 'C = 시트 위 끝을 아치로 깎아 지도를 감싸듯. 탑승권은 여행 진행 막대(4일 중 오늘)로.' })[V]
    + ' 공통: 오른쪽 위치 버튼 = 내 위치(폰 위치 허용 필요, 실시간). 장소 사이 선은 직선(실제 길 아님).</p>';
  if (MW.parentNode !== document.body) document.body.insertBefore(MW, $('#sheet'));   // 다시 그리기 전에 지도 상자를 빼 둠
  $('#inner').innerHTML = h;
  placeMap(); drawMap(M);
}
// A는 지도를 일정 사이 칸으로 옮기고, B·C는 화면 뒤 고정
function placeMap() {
  if (V === 'A') $('#mapslot').appendChild(MW);
  if (map) setTimeout(() => { map.resize(); fit(); }, 30);
}
function drawMap(M) {
  if (!map || !ready) return;
  markers.forEach(m => m.remove()); markers = [];
  M.groups.forEach(g => {
    const el = document.createElement('button');
    el.className = 'mk ' + g.state; el.textContent = g.its.map(i => i.no).join('·'); el.setAttribute('aria-label', g.its.map(i => i.no + '번 ' + i.n).join(', '));
    el.onclick = () => selectNo((g.its.find(i => i.state === 'now') || g.its[0]).no, false);
    markers.push(new maplibregl.Marker({ element: el }).setLngLat(PL[g.p].slice(0, 2)).addTo(map));
  });
  const pts = M.items.filter(i => i.p), past = [], rest = [];
  pts.forEach(it => { const c = PL[it.p].slice(0, 2); if (it.state === 'past' || it.state === 'now') past.push(c); if (it.state !== 'past') rest.push(c); });
  const ln = c => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: c.length > 1 ? c : [] } });
  map.getSource('past').setData(ln(day === NOW.day ? past : []));
  map.getSource('rest').setData(ln(day === NOW.day ? rest : pts.map(i => PL[i.p].slice(0, 2))));
  fit(M);
}
function visibleBox() {   // 지도에서 실제로 보이는 부분(말풍선 아래 ~ 시트 위)
  const r = MW.getBoundingClientRect(), topB = $('#top').getBoundingClientRect().bottom;
  if (V === 'A') return { top: 40, bottom: 40 };
  const sheetTop = $('#sheet').getBoundingClientRect().top;
  return { top: Math.max(topB - r.top, 0) + 28, bottom: Math.max(r.bottom - sheetTop, 0) + 48 };
}
function fit(M, animate) {
  if (!map) return; M = M || model(DAYS[day]);
  let pts = M.items.filter(i => i.p && (day !== NOW.day || i.state !== 'past')).map(i => PL[i.p].slice(0, 2));
  if (pts.length > 1) { const far = pts.filter(c => Math.abs(c[1] - pts[pts.length - 1][1]) < 0.15); if (far.length > 1) pts = far; }   // 공항처럼 멀리 떨어진 곳은 빼고 맞춤
  if (!pts.length) pts = M.items.filter(i => i.p).map(i => PL[i.p].slice(0, 2));
  if (!pts.length) return;
  const b = pts.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(pts[0], pts[0])), v = visibleBox();
  map.fitBounds(b, { padding: { top: v.top, bottom: v.bottom, left: 48, right: 72 }, maxZoom: 16, duration: animate ? 700 : 0 });
}
function selectNo(no, fromList) {
  const it = DAYS[day].items.find(i => i.no === no && !i.fly); if (!it) return;
  markers.forEach(m => m.getElement().classList.toggle('sel', m.getElement().textContent.split('·').includes(String(no))));
  if (it.p) { const v = visibleBox(); map.easeTo({ center: PL[it.p].slice(0, 2), zoom: Math.max(map.getZoom(), 15.5), duration: 600, padding: { top: v.top, bottom: v.bottom, left: 0, right: 0 } }); }
  if (V !== 'A' && fromList && scrollY > 40) scrollTo({ top: 0, behavior: 'smooth' });
  if (!fromList) { const row = document.querySelector('.li[data-no="' + no + '"]'); if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1200); } }
}
let tt; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2600); }
// 내 위치: 폰 위치를 계속 받아 파란 점을 옮김. 처음 한 번만 그쪽으로 이동
function toggleMe() {
  if (watch !== null) { navigator.geolocation.clearWatch(watch); watch = null; meMk && meMk.remove(); meMk = null; $('#meBtn').classList.remove('on'); toast('내 위치 끔'); return; }
  if (!navigator.geolocation) { toast('이 브라우저는 위치를 지원하지 않아요'); return; }
  $('#meBtn').classList.add('on'); meFirst = true; toast('위치 찾는 중…');
  watch = navigator.geolocation.watchPosition(p => {
    const c = [p.coords.longitude, p.coords.latitude];
    if (!meMk) { const el = document.createElement('div'); el.className = 'me'; el.title = '내 위치'; meMk = new maplibregl.Marker({ element: el }).setLngLat(c).addTo(map); } else meMk.setLngLat(c);
    if (meFirst) { meFirst = false; const v = visibleBox(); map.easeTo({ center: c, zoom: 15, duration: 800, padding: { top: v.top, bottom: v.bottom, left: 0, right: 0 } }); toast('내 위치 · 정확도 약 ' + Math.round(p.coords.accuracy) + 'm'); }
  }, err => { $('#meBtn').classList.remove('on'); watch = null; toast(err.code === 1 ? '위치 권한이 꺼져 있어요 · 브라우저 설정에서 허용' : '위치를 못 찾았어요'); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}
document.addEventListener('click', e => {
  const vb = e.target.closest('#vsw [data-v]'); if (vb) { V = vb.dataset.v; try { localStorage.setItem('gaboja-mapv', V); } catch (_) {} scrollTo(0, 0); render(); return; }
  const dd = e.target.closest('[data-d]'); if (dd) { day = +dd.dataset.d; render(); return; }
  if (e.target.closest('a')) return;
  const row = e.target.closest('[data-no]'); if (row) { selectNo(+row.dataset.no, true); return; }
  const go = e.target.closest('[data-go]'); if (go && go.dataset.go) { selectNo(+go.dataset.go, false); return; }
  if (e.target.closest('#fitBtn')) { markers.forEach(m => m.getElement().classList.remove('sel')); fit(null, true); return; }
  if (e.target.closest('#meBtn')) { toggleMe(); return; }
});
function onScroll() { const t = $('#top').getBoundingClientRect().bottom; document.body.classList.toggle('under', V !== 'A' && $('#sheet').getBoundingClientRect().top < t); }
addEventListener('scroll', onScroll, { passive: true });
function fitTop() { document.documentElement.style.setProperty('--topH', Math.round($('#top').getBoundingClientRect().bottom) + 'px'); }
addEventListener('resize', () => { fitTop(); map && map.resize(); });

map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [135.5023, 34.6670], zoom: 14.5, attributionControl: false });
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
map.on('load', () => {
  map.getStyle().layers.forEach(l => { if (l.type === 'symbol' && l.layout && l.layout['text-field']) map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:ko'], ['get', 'name']]); });
  map.addSource('past', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
  map.addSource('rest', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
  map.addLayer({ id: 'past', type: 'line', source: 'past', paint: { 'line-color': '#9AA0A8', 'line-width': 3 }, layout: { 'line-cap': 'round' } });
  map.addLayer({ id: 'rest', type: 'line', source: 'rest', paint: { 'line-color': '#15171A', 'line-width': 3, 'line-dasharray': [1.5, 1.5] }, layout: { 'line-cap': 'round' } });
  ready = true; drawMap(model(DAYS[day]));
});
fitTop(); render();
</script>
