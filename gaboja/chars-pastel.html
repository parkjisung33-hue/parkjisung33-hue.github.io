<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VZTR 캐릭터 파스텔 시안</title>
<style>
:root { --bg: #EEF0F3; --ink: #0A1F33; --sub: #5B6B7A; --blue: #2F5BFF; --sh: 0 1px 2px rgba(24,36,60,.05), 0 .375rem 1rem -.5rem rgba(24,36,60,.16); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 140px; }
h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
.lead { margin: 0 0 18px; color: var(--sub); font-size: 14px; line-height: 1.65; word-break: keep-all; }
.pal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
.pal div { border-radius: 999px; height: 46px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: rgba(10,31,51,.7); }
.pal.g div { border-radius: 50%; width: 46px; justify-self: center; }
.cap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; font-size: 12px; color: var(--sub); text-align: center; }
.grp { margin: 26px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.grp b { font-size: 16px; } .grp span { font-size: 12px; color: var(--sub); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: var(--sh); }
.card .nm { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; } .card .nm span { color: var(--sub); font-weight: 500; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair figure { margin: 0; }
.pair .av { border-radius: 8px; overflow: hidden; aspect-ratio: 100 / 92; }
.pair .av svg { display: block; width: 100%; height: 100%; }
.pair figcaption { font-size: 11px; color: var(--sub); text-align: center; margin-top: 4px; }
.pk { display: flex; gap: 8px; margin-top: 26px; }
.pk button { height: 44px; padding: 0 20px; border-radius: 8px; background: #fff; font-weight: 700; box-shadow: var(--sh); }
.pk button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.pk input { flex: 1; min-width: 0; height: 44px; border: 1px solid rgba(10,31,51,.12); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(10,31,51,.96); color: #fff; display: flex; gap: 10px; align-items: center; z-index: 5; }
.dock .s { flex: 1; font-size: 13px; } .dock button { background: var(--blue); color: #fff; border-radius: 8px; padding: 11px 16px; font-weight: 700; font-size: 14px; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr 1fr; } .card { padding: 8px; } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>캐릭터 파스텔 시안</h1>
  <p class="lead">보내 주신 팔레트를 짐 캐릭터 16개에 넣었습니다. <b>캐릭터 몸 색(메인)</b> = 위 알약 4색, <b>몸의 그라디언트와 바탕</b> = 아래 동그라미 4개(바탕은 캐릭터가 묻히지 않게 연하게). 묶음 4개에 한 색씩. 왼쪽 = 지금, 오른쪽 = 파스텔.</p>
  <div class="pal"><div style="background:#9DD2D8">#9DD2D8 · 로컬 탐험</div><div style="background:#FADCE4">#FADCE4 · 취향 수집</div><div style="background:#9DC3E2">#9DC3E2 · 명소 정복</div><div style="background:#FFB5CC">#FFB5CC · 힐링 충전</div></div>
  <div class="pal g"><div style="background:linear-gradient(135deg,#9DD2D8,#9DC3E2)"></div><div style="background:linear-gradient(135deg,#FADCE4,#FFC6D7)"></div><div style="background:linear-gradient(135deg,#9DC3E2,#B8CCE0 55%,#F2DDE6)"></div><div style="background:linear-gradient(135deg,#FFB5CC,#E9BCE0)"></div></div>
  <div class="cap"><span>청록 → 하늘</span><span>연분홍 → 분홍</span><span>하늘 → 연분홍빛 회색</span><span>분홍 → 라벤더</span></div>
  <div id="list"></div>
  <div class="pk"><button id="pick">파스텔로 갈게요</button><input id="memo" placeholder="메모 (예: 취향 수집형은 너무 연함 → 진하게)"></div>
</div>
<div class="dock"><div class="s" id="dockTx">메모를 남기고 답 복사</div><button id="copy">답 복사</button></div>
<script src="chars.js?v=pastel1"></script>
<script>window.CUR_CHAR = window.GABOJA_CHAR; window.CUR_BG = window.GABOJA_CHAR_BG;</script>
<script src="chars_pastel.js?v=4"></script>
<script>
const NEW_CHAR = window.GABOJA_CHAR;
const GROUPS = [['로컬 탐험형', ['LSFJ','LSFP','LSRJ','LSRP']], ['취향 수집형', ['LEFJ','LEFP','LERJ','LERP']], ['명소 정복형', ['HSFJ','HSFP','HSRJ','HSRP']], ['힐링 충전형', ['HEFJ','HEFP','HERJ','HERP']]];
document.getElementById('list').innerHTML = GROUPS.map(([g, cs]) => `<div class="grp"><b>${g}</b><span>${cs.join(' · ')}</span></div><div class="grid">` + cs.map(c => `<div class="card"><div class="nm">${c}<span>${window.GABOJA_CHAR_ITEM(c)}</span></div><div class="pair"><figure><div class="av">${window.CUR_CHAR(c)}</div><figcaption>지금</figcaption></figure><figure><div class="av">${NEW_CHAR(c)}</div><figcaption>파스텔</figcaption></figure></div></div>`).join('') + '</div>').join('');
const KEY = 'vztr-charpastel-v1'; let S = { pick: false, memo: '' }; try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const pb = document.getElementById('pick'), mm = document.getElementById('memo');
const draw = () => { pb.setAttribute('aria-pressed', !!S.pick); pb.textContent = S.pick ? '✓ 파스텔로 갈게요' : '파스텔로 갈게요'; }; draw(); mm.value = S.memo || '';
pb.onclick = () => { S.pick = !S.pick; save(); draw(); }; mm.oninput = () => { S.memo = mm.value; save(); };
document.getElementById('copy').onclick = function () {
  const t = '[VZTR 캐릭터 파스텔] ' + (S.pick ? '파스텔로 진행' : '아직 결정 안 함') + (S.memo ? '\n메모: ' + S.memo : '');
  const btn = this, ok = () => { btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = '답 복사', 1600); };
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) {} a.remove(); };
  navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(ok, fb) : fb();
};
</script>
</body>
</html>
