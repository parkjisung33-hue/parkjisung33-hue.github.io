<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VZTR 영문 글꼴 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Sans+KR:wght@700&family=Inter:wght@500;700&family=Inter+Tight:wght@500;700;800&family=Manrope:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Figtree:wght@500;700;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root { --ink:#16171A; --sub:#6B7079; --hair:#E6E8EC; --paper:#FFFFFF; --canvas:#F4F5F7; --blue:#1F5FE0; --kr:"IBM Plex Sans KR","Pretendard Variable",sans-serif; --kr2:"Pretendard Variable",sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#ECEDEF; --sub:#9AA0A8; --hair:#2E3036; --paper:#1F2024; --canvas:#16171A; --blue:#6D97EB; } }
:root[data-theme="dark"] { --ink:#ECEDEF; --sub:#9AA0A8; --hair:#2E3036; --paper:#1F2024; --canvas:#16171A; --blue:#6D97EB; }
* { box-sizing: border-box; } body { margin:0; background:var(--canvas); color:var(--ink); font-family:var(--kr2); padding:20px 16px 120px; }
h1 { font-family:var(--kr); font-size:1.375rem; margin:0 0 4px; } .lead { color:var(--sub); font-size:.875rem; margin:0 0 18px; line-height:1.5; }
.opt { background:var(--paper); border-radius:16px; padding:16px; margin-bottom:12px; border:2px solid transparent; }
.opt.on { border-color:var(--blue); }
.hd { display:flex; align-items:center; gap:8px; margin-bottom:12px; } .hd input { width:20px; height:20px; accent-color:var(--blue); }
.hd b { font-family:var(--kr); font-size:1rem; } .hd small { color:var(--sub); font-size:.75rem; }
.row { display:flex; align-items:baseline; gap:8px; padding:8px 0; border-top:1px solid var(--hair); }
.row .k { font-family:var(--kr); font-weight:700; font-size:1.125rem; } .row .e { color:var(--blue); font-weight:700; font-size:.95rem; } .row .s { display:block; color:var(--sub); font-size:.875rem; }
.pass { display:flex; justify-content:space-between; align-items:flex-end; padding:10px 0 4px; }
.pass .big { font-size:2rem; font-weight:800; letter-spacing:-.02em; line-height:1; } .pass .sm { font-size:.75rem; color:var(--sub); font-weight:500; margin-top:4px; }
.lab { font-size:.6875rem; letter-spacing:.08em; font-weight:700; color:var(--blue); }
.en { font-size:.9375rem; line-height:1.45; margin-top:8px; }
textarea { width:100%; margin-top:10px; border:1px solid var(--hair); border-radius:10px; background:var(--canvas); color:var(--ink); padding:8px 10px; font:inherit; font-size:.875rem; min-height:44px; }
.bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1px solid var(--hair); display:flex; gap:8px; }
.bar button { flex:1; height:48px; border-radius:12px; border:0; font:inherit; font-weight:700; font-size:1rem; background:var(--ink); color:var(--paper); }
.bar button.ghost { flex:none; width:auto; padding:0 14px; background:transparent; color:var(--ink); border:1px solid var(--hair); }
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:999px; font-size:.875rem; opacity:0; transition:opacity .2s; }
.toast.on { opacity:1; }
</style></head><body>
<h1>영문 글꼴 고르기</h1>
<p class="lead">앱 안 영문·숫자(유형 글자 뜻·탑승권·날짜·시각·영어판 문장)에 쓸 글꼴. 한글은 지금 그대로(굵은 한글 IBM Plex Sans KR · 보통 한글 Pretendard). 마음에 드는 것을 고르고 메모를 남긴 뒤 아래 '답 복사'로 보내 주세요.</p>
<div id="list"></div>
<div class="bar"><button class="ghost" id="theme">어둡게</button><button id="copy">답 복사</button></div>
<div class="toast" id="toast">복사했어요</div>
<script>
const F = [
  ['IBM Plex Sans', '지금 쓰는 것 (11/19 글꼴 A)', 'IBM 사내 글꼴 · 기계적·단정, 한글 IBM Plex Sans KR과 한 가족'],
  ['Inter Tight', '워드마크(vztr.)와 같은 가족', '좁고 단단함 · 로고·코드 글자와 한 톤'],
  ['Inter', '가장 무난한 UI 글꼴', '읽기 편하고 중립적 · 숫자 폭 고름'],
  ['Manrope', '둥글고 현대적', '기하형 + 약간 둥근 끝 · 친근'],
  ['DM Sans', '부드럽고 낮은 대비', '작은 크기에서 또렷 · 귀여운 쪽'],
  ['Plus Jakarta Sans', '살짝 개성 있는 기하형', '여행·라이프스타일 앱에서 흔한 느낌'],
  ['Figtree', '깔끔하고 친근한 기하형', 'Pretendard와 결이 비슷'],
  ['Outfit', '동그란 기하형', '캐릭터와 잘 붙는 귀여운 쪽 · 본문엔 덜 단정']
];
const box = document.getElementById('list');
box.innerHTML = F.map(([f, t, d], i) => `<div class="opt" data-i="${i}"><label class="hd"><input type="radio" name="f" value="${i}"><b>${String.fromCharCode(65 + i)}. ${f}</b><small>${t}</small></label>
  <div style="font-family:'${f}',var(--kr2)">
    <div class="lab">BOARDING PASS · DAY 1</div>
    <div class="pass"><div><div class="big">ICN</div><div class="sm">Incheon · 09:00</div></div><div class="sm">1h 50m · KE723</div><div style="text-align:right"><div class="big">KIX</div><div class="sm">Kansai · 10:50</div></div></div>
    <div class="row"><span class="k">핫플</span><span class="e">H = Hot place</span></div>
    <div class="row"><span class="k">계획형</span><span class="e">J = MBTI의 J</span></div>
    <div class="row" style="display:block"><span style="font-size:1.75rem;font-weight:800">14:27</span> <span style="color:var(--sub);font-size:.875rem">DAY 2 · 12.5 Sat · 16°/7°</span></div>
    <div class="en">Built around your 5 picks · the rest filled with places nearby</div>
    <div class="sm" style="color:var(--sub);font-size:.75rem;margin-top:6px">${d}</div>
  </div><textarea placeholder="메모 (예: 숫자는 좋은데 글자가 너무 좁아요)"></textarea></div>`).join('');
const pick = () => { const r = box.querySelector('input:checked'); box.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', r && o.dataset.i === r.value)); };
box.addEventListener('change', pick);
document.getElementById('copy').onclick = () => {
  const r = box.querySelector('input:checked'), memos = [...box.querySelectorAll('.opt')].map((o, i) => { const v = o.querySelector('textarea').value.trim(); return v ? String.fromCharCode(65 + i) + ' ' + F[i][0] + ': ' + v : ''; }).filter(Boolean);
  const txt = '[영문 글꼴] 고름: ' + (r ? String.fromCharCode(65 + +r.value) + ' ' + F[+r.value][0] : '안 고름') + (memos.length ? '\n' + memos.join('\n') : '');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { const t = document.getElementById('toast'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1400); }).catch(() => prompt('복사해 주세요', txt));
};
document.getElementById('theme').onclick = e => { const d = document.documentElement, dark = d.dataset.theme !== 'dark'; d.dataset.theme = dark ? 'dark' : 'light'; e.target.textContent = dark ? '밝게' : '어둡게'; };
</script>
</body></html>
