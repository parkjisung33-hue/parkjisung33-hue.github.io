<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VZTR 머리·DAY 통합 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..800&display=swap">
<style>
/* 14번 피드백: 가이드북 맨 위 메뉴 + DAY 메뉴 통합 — 시안 5 (2026-11-19)
   곡률 = 1차안 기준(상자 8px · 알약 8px). 앱 토큰 그대로 */
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap;
  src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("../app/fonts/PretendardVariable.woff2") format("woff2-variations"); }
:root {
  --canvas: #EEF0F3; --ink: #0A1F33; --sub: #5B6B7A; --hair: rgba(10,31,51,.09); --paper: #fff;
  --blue: #2F5BFF; --blue-soft: rgba(47,91,255,.09); --green: #2F9E6E; --amber: #E8912A;
  --glass: rgba(255,255,255,.78); --edge: rgba(255,255,255,.95);
  --sh: 0 1px 2px rgba(24,36,60,.05), 0 .25rem .75rem -.375rem rgba(24,36,60,.14);
  --r: 8px; --kr: "Pretendard Variable", Pretendard, system-ui, sans-serif; --mono: "Inter Tight", var(--kr);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #E4E7EB; color: var(--ink); font-family: var(--kr); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.intro { max-width: 1240px; margin: 0 auto; padding: 28px 16px 8px; }
.intro h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
.intro p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; word-break: keep-all; }
.intro .rule { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.intro .rule span { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: #fff; color: var(--sub); }

.grid { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px 20px; padding-bottom: 140px; }
.opt { display: flex; flex-direction: column; gap: 10px; }
.opt .hd { display: flex; align-items: baseline; gap: 8px; }
.opt .hd b { font-family: var(--mono); font-size: 15px; font-weight: 800; color: var(--blue); }
.opt .hd h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.opt .why { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.55; word-break: keep-all; min-height: 3.1em; }

/* 폰 화면 틀 */
.phone { position: relative; width: 100%; max-width: 375px; height: 400px; margin: 0 auto; border-radius: 22px; background: var(--canvas); overflow: hidden; box-shadow: 0 10px 30px -14px rgba(10,31,51,.35); border: 1px solid rgba(10,31,51,.06); }
.scr { position: absolute; inset: 0; overflow: hidden; padding: 12px 12px 0; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--sh); border: 1px solid var(--edge); }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r); flex: none; }
.ib svg { width: 22px; height: 22px; }
.seg { display: flex; background: rgba(10,31,51,.06); border-radius: var(--r); padding: 3px; flex: none; }
.seg button { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 6px; color: var(--sub); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(10,31,51,.12); }
.ttl { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.today { color: var(--blue); }

/* 아래 내용(공통): 하루 머리 + 일정 2칸 */
.body { padding: 14px 4px 0; }
.dh .city { font-size: 13px; font-weight: 600; color: var(--sub); }
.dh h3 { margin: 4px 0 6px; font-size: 22px; letter-spacing: -.015em; line-height: 1.3; }
.dh .wx { font-size: 14px; color: var(--sub); display: flex; gap: 6px; align-items: center; }
.dh .wx b { color: var(--ink); font-weight: 600; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.cards div { background: #fff; border-radius: var(--r); padding: 11px 12px; box-shadow: var(--sh); }
.cards small { display: block; font-family: var(--mono); font-size: 12px; color: var(--sub); margin-bottom: 3px; }
.cards b { font-size: 15px; }

/* ── A: 한 상자 두 줄 ── */
.A .box { border-radius: var(--r); padding: 6px; }
.A .r1 { display: flex; align-items: center; gap: 6px; }
.A .r2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--hair); }
.A .r2 button { height: 44px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.A .r2 b { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--sub); }
.A .r2 span { font-size: 14px; font-weight: 700; }
.A .r2 button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.A .r2 button[aria-pressed="true"] b { color: rgba(255,255,255,.7); }

/* ── B: 한 줄 + 날짜 펼침 ── */
.B .box { display: flex; align-items: center; gap: 6px; border-radius: var(--r); padding: 6px; }
.B .mid { flex: 1; min-width: 0; text-align: left; padding: 2px 4px; border-radius: 6px; }
.B .mid .t { display: block; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.B .mid .d { display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.B .mid .d svg { width: 18px; height: 18px; flex: none; stroke-width: 2.2; color: var(--sub); transition: transform .2s; }
.B.open .mid .d svg { transform: rotate(180deg); }
.B .drop { position: absolute; left: 12px; right: 12px; top: 66px; border-radius: var(--r); padding: 6px; z-index: 5; display: none; background: rgba(255,255,255,.97); }
.B.open .drop { display: block; }
.B .drop button { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 6px; text-align: left; }
.B .drop button + button { border-top: 1px solid var(--hair); }
.B .drop b { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.B .drop span { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.B .drop em { font-style: normal; font-size: 12px; color: var(--sub); }
.B .drop button[aria-pressed="true"] { background: var(--blue-soft); }
.B .drop button[aria-pressed="true"] b, .B .drop button[aria-pressed="true"] span { color: var(--blue); }

/* ── C: 좌우 넘기기 ── */
.C .box { border-radius: var(--r); padding: 6px; }
.C .r1 { display: flex; align-items: center; gap: 6px; }
.C .r2 { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.C .r2 .nav { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink); }
.C .r2 .nav:disabled { opacity: .25; }
.C .r2 .nav svg { width: 20px; height: 20px; }
.C .r2 .c { flex: 1; text-align: center; }
.C .r2 .c b { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.C .r2 .c .dots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
.C .r2 .c .dots i { width: 5px; height: 5px; border-radius: 3px; background: rgba(10,31,51,.18); transition: width .2s, background .2s; }
.C .r2 .c .dots i.on { width: 16px; background: var(--ink); }

/* ── D: 날짜 띠(달력처럼) ── */
.D .box { border-radius: var(--r); padding: 6px 6px 8px; }
.D .r1 { display: flex; align-items: center; gap: 6px; }
.D .sub { font-size: 12px; color: var(--sub); font-weight: 600; padding: 0 6px; margin-top: 2px; display: flex; gap: 6px; }
.D .r2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.D .r2 button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; }
.D .r2 small { font-size: 12px; color: var(--sub); font-weight: 600; }
.D .r2 span { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r); font-family: var(--mono); font-size: 17px; font-weight: 700; }
.D .r2 button[aria-pressed="true"] span { background: var(--ink); color: #fff; }
.D .r2 button[aria-pressed="true"] small { color: var(--ink); }
.D .r2 i { width: 4px; height: 4px; border-radius: 2px; background: transparent; }
.D .r2 button.dot i { background: var(--amber); }

/* ── E: 진행 막대 + 상태 한 줄 ── */
.E .box { border-radius: var(--r); padding: 6px 6px 10px; }
.E .r1 { display: flex; align-items: center; gap: 6px; }
.E .st { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 8px 0; font-size: 13px; }
.E .st b { font-weight: 700; }
.E .st .tag { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.E .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 10px 8px 0; }
.E .bar button { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 0 0 2px; }
.E .bar i { display: block; height: 5px; border-radius: 3px; background: rgba(10,31,51,.12); }
.E .bar button[aria-pressed="true"] i { background: var(--ink); }
.E .bar span { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--sub); }
.E .bar button[aria-pressed="true"] span { color: var(--ink); font-weight: 800; }

/* 고르기 */
.pick { display: flex; gap: 8px; align-items: center; justify-content: center; max-width: 375px; margin: 0 auto; width: 100%; }
.pick button { flex: 1; height: 42px; border-radius: 8px; background: #fff; font-weight: 700; font-size: 14px; box-shadow: var(--sh); }
.pick button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.memo { max-width: 375px; margin: 0 auto; width: 100%; }
.memo textarea { width: 100%; min-height: 44px; border: 1px solid rgba(10,31,51,.12); border-radius: 8px; padding: 10px; font: inherit; font-size: 14px; resize: vertical; background: #fff; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(10,31,51,.96); color: #fff; display: flex; gap: 10px; align-items: center; z-index: 50; }
.dock .s { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; word-break: keep-all; }
.dock button { background: var(--blue); color: #fff; border-radius: 8px; padding: 11px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; }
@media (max-width: 420px) { .grid { padding: 12px 12px 140px; grid-template-columns: 1fr; } .phone { height: 390px; } }
</style>
</head>
<body>
<div class="intro">
  <h1>맨 위 + DAY 합치기 — 시안 5</h1>
  <p>피드백 14번. 위에는 <b>직접 지은 제목 · 요약/상세 · 메뉴</b>만 두고, 날짜 고르기를 같은 자리에 합쳤습니다. 각 화면에서 날짜를 직접 눌러 보세요. 맘에 드는 것을 고르고(여러 개 가능) 메모를 남긴 뒤 아래 <b>답 복사</b>를 눌러 보내 주세요.</p>
  <div class="rule"><span>가독성</span><span>심플</span><span>필요한 정보만</span><span>곡률 = 1차안 8px</span></div>
</div>
<div class="grid" id="grid"></div>
<div class="dock"><div class="s" id="dockTx">아직 고른 시안이 없어요</div><button id="copy">답 복사</button></div>

<script>
const DAYS = [
  { no: 1, md: '12.4', dd: '4', wd: '금', city: '오사카', t: '도착하자마자 도톤보리', wx: '15°/12°', rain: '비 29%', tbd: false },
  { no: 2, md: '12.5', dd: '5', wd: '토', city: '교토', t: '교토 골목 하루 산책', wx: '13°/6°', rain: '맑음', tbd: false },
  { no: 3, md: '12.6', dd: '6', wd: '일', city: '오사카', t: '우메다 쇼핑 데이', wx: '14°/8°', rain: '구름', tbd: true },
  { no: 4, md: '12.7', dd: '7', wd: '월', city: '오사카', t: '공항 가는 날', wx: '12°/7°', rain: '맑음', tbd: false },
];
const TITLE = '오사카·교토에서 4일', STATUS = '출발 15일 전', DD = 'D-15';
const MENU = '<button class="ib" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>';
const SEG = '<div class="seg"><button aria-pressed="true">요약</button><button aria-pressed="false">상세</button></div>';
const CHEV = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const L = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>', R = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const CLOUD = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 18h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>';
const body = d => '<div class="body"><div class="dh"><div class="city">' + d.city + '</div><h3>' + d.t + '</h3><div class="wx">' + CLOUD + '<b class="mono">' + d.wx + '</b>' + d.rain + '</div></div>'
  + '<div class="cards"><div><small>' + (d.tbd ? '1번째' : '06:45') + '</small><b>' + (d.no === 2 ? '교토역' : '인천공항 T1') + '</b></div><div><small>' + (d.tbd ? '2번째' : '09:00') + '</small><b>' + (d.no === 2 ? '기요미즈데라' : '난바 · 짐') + '</b></div></div></div>';

const OPTS = [
  { k: 'A', name: '한 상자 두 줄', why: '지금 두 상자를 하나로 붙이고, 날짜 칸을 아래 줄로. 제일 덜 낯설고 한눈에 4일이 다 보임. 대신 높이는 가장 큼.',
    html: d => '<div class="box glass"><div class="r1">' + MENU + '<div class="ttl">' + TITLE + '</div>' + SEG + '</div><div class="r2">'
      + DAYS.map(x => '<button data-d="' + x.no + '" aria-pressed="' + (x === d) + '"><b>DAY ' + x.no + '</b><span>' + x.md + ' ' + x.wd + '</span></button>').join('') + '</div></div>' + body(d) },
  { k: 'B', name: '한 줄 + 날짜 펼침', why: '맨 위가 한 줄로 가장 얇음. 제목 아래에 지금 보는 날(DAY 2 · 12.5 토 ▾)을 크게, 누르면 날짜와 그날 제목 목록이 펼쳐짐. 날짜를 바꾸려면 한 번 더 눌러야 함.',
    html: d => '<div class="box glass">' + MENU + '<button class="mid" data-open><span class="t">' + TITLE + '</span><span class="d">DAY ' + d.no + ' · ' + d.md + ' ' + d.wd + CHEV + '</span></button>' + SEG + '</div>'
      + '<div class="drop glass">' + DAYS.map(x => '<button data-d="' + x.no + '" aria-pressed="' + (x === d) + '"><b>DAY ' + x.no + '</b><span>' + x.t + '</span><em class="mono">' + x.md + ' ' + x.wd + '</em></button>').join('') + '</div>' + body(d) },
  { k: 'C', name: '좌우 넘기기', why: '가운데에 지금 날 하나만 크게, 양옆 화살표(또는 화면 밀기)로 하루씩 넘김. 점으로 몇째 날인지 표시. 여행이 길어져도(7일+) 모양이 안 변함.',
    html: d => '<div class="box glass"><div class="r1">' + MENU + '<div class="ttl">' + TITLE + '</div>' + SEG + '</div><div class="r2">'
      + '<button class="nav" data-step="-1" ' + (d.no === 1 ? 'disabled' : '') + ' aria-label="이전 날">' + L + '</button><div class="c"><b>DAY ' + d.no + ' <span class="mono" style="font-weight:600;color:var(--sub);font-size:15px">· ' + d.md + ' ' + d.wd + '</span></b><div class="dots">'
      + DAYS.map(x => '<i class="' + (x === d ? 'on' : '') + '"></i>').join('') + '</div></div>'
      + '<button class="nav" data-step="1" ' + (d.no === DAYS.length ? 'disabled' : '') + ' aria-label="다음 날">' + R + '</button></div></div>' + body(d) },
  { k: 'D', name: '날짜 띠 (달력처럼)', why: '요일 + 날짜 숫자만 달력처럼. \'DAY 1\' 글자 없이 날짜로 바로 찾음. 제목 아래 기간·D-day 한 줄. 주황 점 = 시각 미정 같은 확인할 게 있는 날.',
    html: d => '<div class="box glass"><div class="r1">' + MENU + '<div class="ttl">' + TITLE + '</div>' + SEG + '</div>'
      + '<div class="sub"><span>12월 4일 – 7일</span><span>·</span><span class="today">' + DD + '</span></div><div class="r2">'
      + DAYS.map(x => '<button data-d="' + x.no + '" aria-pressed="' + (x === d) + '"' + (x.tbd ? ' class="dot"' : '') + '><small>' + x.wd + '</small><span>' + x.dd + '</span><i></i></button>').join('') + '</div></div>' + body(d) },
  { k: 'E', name: '진행 막대 + 상태 한 줄', why: '날짜를 막대로 나눠 여행 흐름(몇째 날인지)을 보여 줌. 위에 지금 상태 한 줄(출발 15일 전 / 여행 중이면 \'오늘 DAY 2\'). 막대를 눌러 날짜 이동.',
    html: d => '<div class="box glass"><div class="r1">' + MENU + '<div class="ttl">' + TITLE + '</div>' + SEG + '</div>'
      + '<div class="st"><span><b>DAY ' + d.no + '</b> <span class="mono" style="color:var(--sub)">' + d.md + ' ' + d.wd + '</span></span><span class="tag">' + STATUS + '</span></div><div class="bar">'
      + DAYS.map(x => '<button data-d="' + x.no + '" aria-pressed="' + (x === d) + '"><i></i><span>' + x.md + '</span></button>').join('') + '</div></div>' + body(d) },
];

const S = { day: {}, pick: {}, memo: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem('vztr-p14') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('vztr-p14', JSON.stringify(S)); } catch (e) {} dock(); };

const grid = document.getElementById('grid');
grid.innerHTML = OPTS.map(o => '<section class="opt" data-k="' + o.k + '"><div class="hd"><b>' + o.k + '</b><h2>' + o.name + '</h2></div><p class="why">' + o.why + '</p>'
  + '<div class="phone"><div class="scr ' + o.k + '"></div></div>'
  + '<div class="pick"><button data-pick>이걸로</button></div>'
  + '<div class="memo"><textarea placeholder="' + o.k + ' 메모 (예: 막대는 좋은데 상태 줄은 빼기)"></textarea></div></section>').join('');

function draw(k) {
  const o = OPTS.find(x => x.k === k), sec = grid.querySelector('[data-k="' + k + '"]');
  const d = DAYS[(S.day[k] || 1) - 1];
  sec.querySelector('.scr').innerHTML = o.html(d);
  sec.querySelector('[data-pick]').setAttribute('aria-pressed', !!S.pick[k]);
  sec.querySelector('[data-pick]').textContent = S.pick[k] ? '✓ 골랐어요' : '이걸로';
}
OPTS.forEach(o => { draw(o.k); grid.querySelector('[data-k="' + o.k + '"] textarea').value = S.memo[o.k] || ''; });

grid.addEventListener('click', e => {
  const sec = e.target.closest('.opt'); if (!sec) return; const k = sec.dataset.k, scr = sec.querySelector('.scr');
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-pick')) { S.pick[k] = !S.pick[k]; save(); draw(k); return; }
  if (b.hasAttribute('data-open')) { scr.classList.toggle('open'); return; }
  if (b.dataset.d) { S.day[k] = +b.dataset.d; scr.classList.remove('open'); save(); draw(k); return; }
  if (b.dataset.step) { S.day[k] = Math.max(1, Math.min(DAYS.length, (S.day[k] || 1) + +b.dataset.step)); save(); draw(k); return; }
  if (b.closest('.seg')) { b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }
});
grid.addEventListener('input', e => { const sec = e.target.closest('.opt'); if (sec && e.target.tagName === 'TEXTAREA') { S.memo[sec.dataset.k] = e.target.value; save(); } });
/* C안: 화면 밀어서 넘기기 */
(function () {
  const scr = grid.querySelector('.scr.C'); let x0 = null;
  scr.addEventListener('pointerdown', e => { x0 = e.clientX; });
  scr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { S.day.C = Math.max(1, Math.min(DAYS.length, (S.day.C || 1) + (dx < 0 ? 1 : -1))); save(); draw('C'); } });
})();

function dock() {
  const p = OPTS.filter(o => S.pick[o.k]).map(o => o.k);
  document.getElementById('dockTx').textContent = p.length ? '고른 시안: ' + p.join(' · ') : '아직 고른 시안이 없어요';
}
dock();
document.getElementById('copy').addEventListener('click', function () {
  const p = OPTS.filter(o => S.pick[o.k]);
  const lines = ['[VZTR 14 머리·DAY 통합] 고른 시안: ' + (p.length ? p.map(o => o.k + ' ' + o.name).join(' / ') : '없음')];
  OPTS.forEach(o => { if (S.memo[o.k]) lines.push(o.k + ' 메모: ' + S.memo[o.k]); });
  const t = lines.join('\n'), btn = this;
  const ok = () => { btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = '답 복사', 1600); };
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); };
  navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(ok, fb) : fb();
});
</script>
</body>
