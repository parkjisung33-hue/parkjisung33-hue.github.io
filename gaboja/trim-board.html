<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VZTR 덜어내기·간격 보드</title>
<link rel="stylesheet" href="fonts/vztr-fonts.css?v=2">
<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url(fonts/PretendardVariable.woff2) format("woff2-variations"); }
:root { --bg: #EEF0F3; --card: #fff; --ink: #0A1F33; --sub: #5B6B7A; --line: #E3E6EA; --blue: #2F5BFF; --pink: #CF3F66; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; word-break: keep-all; }
main { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
.lead { color: var(--sub); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }
.how { background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
.how b { color: var(--blue); }
h2 { font-size: 13px; color: var(--sub); margin: 20px 0 8px; font-weight: 700; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-decoration: none; color: inherit; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .n { font-size: 11px; color: var(--sub); width: 18px; font-variant-numeric: tabular-nums; }
.row .t { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
.row .st { font-size: 12px; color: var(--sub); white-space: nowrap; }
.row .st.on { color: var(--blue); font-weight: 700; }
.row .go { color: var(--sub); font-size: 16px; }
textarea { width: 100%; min-height: 84px; border: 1px solid #D5D9DF; border-radius: 12px; padding: 12px; font: inherit; font-size: 14px; margin-top: 8px; background: #fff; }
.btns { display: flex; gap: 8px; margin-top: 10px; }
button { appearance: none; border: 0; border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 14px; font-weight: 700; background: #fff; color: var(--ink); }
button.p { background: var(--blue); color: #fff; flex: 1; }
.sum { font-size: 12px; color: var(--sub); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>덜어내기 · 간격 · 위치</h1>
  <p class="lead">화면마다 대표 하나씩. 고친 건 이 폰(브라우저)에 화면별로 저장되고, 맨 아래에서 전부 한 번에 복사합니다.</p>
  <div class="how">
    ① 화면 열기 → 아래 바 <b>✂ 고르기</b> 켜기 → 화면 아무 곳이나 누르기<br>
    ② <b>↑ 더 큰 덩어리 / ↓ 더 작게</b>로 범위 맞추기<br>
    ③ <b>빼기</b> 탭 = 숨기기 · <b>간격·위치</b> 탭 = 자간·행간·위/아래 여백·사이 간격·좌우 안쪽·위치(2px씩)<br>
    ④ 범위 버튼으로 <b>같은 것 전부 / 이것만</b> 바꾸기 · 끝나면 <b>← 보드</b>
  </div>
  <h2>시작 · 질문 · 입력 · 발급</h2>
  <div class="list" id="lStart"></div>
  <h2>가이드북</h2>
  <div class="list" id="lGuide"></div>
  <h2>전체 메모</h2>
  <textarea id="memo" placeholder="화면 공통으로 하고 싶은 말 (예: 제목 자간은 전부 -0.02em으로 통일)"></textarea>
  <div class="btns"><button class="p" id="copy">전체 답 복사</button></div>
  <p class="sum" id="sum"></p>
</main>
<script>window.TRIM_HUB = true;</script>
<script src="trim.js?v=8ca3cee2"></script>
<script>
(function () {
  var T = window.VZTR_TRIM, MKEY = 'vztr-trim2-board-memo';
  function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function url(x) { return x.g === 'start' ? 'trim-start.html?s=' + x.s + '&scr=' + x.s : 'trim.html?scr=' + x.s + '#sample=air-jp'; }
  function draw() {
    var tot = 0;
    ['start', 'guide'].forEach(function (g) {
      var i = 0;
      document.getElementById(g === 'start' ? 'lStart' : 'lGuide').innerHTML = T.screens.filter(function (x) { return x.g === g; }).map(function (x) {
        var c = T.count(load(T.key(x.g, x.s))), n = c.cut + c.adj; tot += n;
        var st = n || c.memo ? [c.cut ? '빼기 ' + c.cut : '', c.adj ? '조절 ' + c.adj : '', c.memo ? '메모' : ''].filter(Boolean).join(' · ') : '아직';
        return '<a class="row" href="' + url(x) + '"><span class="n">' + (++i) + '</span><span class="t">' + x.n + '</span><span class="st' + (n || c.memo ? ' on' : '') + '">' + st + '</span><span class="go">›</span></a>';
      }).join('');
    });
    document.getElementById('sum').textContent = '고친 것 ' + tot + '개';
  }
  var memo = document.getElementById('memo');
  try { memo.value = localStorage.getItem(MKEY) || ''; } catch (e) {}
  memo.addEventListener('input', function () { try { localStorage.setItem(MKEY, memo.value); } catch (e) {} });
  document.getElementById('copy').addEventListener('click', function () {
    var out = ['[VZTR 덜어내기·간격·위치 보드]'];
    T.screens.forEach(function (x) { var t = T.fmt(load(T.key(x.g, x.s)), (x.g === 'start' ? '시작 · ' : '가이드북 · ') + x.n); if (t) out.push('', t); });
    if (memo.value.trim()) out.push('', '■ 전체 메모', memo.value.trim());
    if (out.length === 1) out.push('(고친 것 없음)');
    var t = out.join('\n'), b = this;
    function ok() { b.textContent = '복사됨 ✓'; setTimeout(function () { b.textContent = '전체 답 복사'; }, 1600); }
    function fb() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
  });
  draw();
  window.addEventListener('pageshow', draw);   // ← 보드로 돌아오면 숫자 새로
})();
</script>
</body>
</html>
