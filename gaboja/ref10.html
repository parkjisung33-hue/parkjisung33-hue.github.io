<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VZTR 레퍼런스 적용 시안</title>
<style>
/* 레퍼런스 10곳 적용 시안 보드 (2026-11-22) — 캐릭터 말풍선 · 버튼 바닥 띠 · 장소 카드 칩
   진짜 앱(index.html·start.html)을 390×844로 띄우고, 고른 안의 CSS만 덮어씌워 보여 줌. 앱 원본·저장값은 안 건드림.
   크기는 rem(390폭 = 16px)로 써서 BI 글꼴이 바뀌어도 숫자만 다시 맞추면 되게 함 */
@font-face { font-family: "Pretendard Variable"; src: url("fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; font-display: swap; }
:root { --bg: #EFEFF1; --card: #fff; --ink: #16171A; --sub: #6B6E75; --hair: rgba(22,23,26,.1); --blue: #1F5FE0; --sh: 0 1px 2px rgba(22,23,26,.05), 0 .25rem .75rem -.375rem rgba(22,23,26,.16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #18191C; --card: #27282C; --ink: #F2F2F3; --sub: #A2A5AC; --hair: rgba(255,255,255,.12); --blue: #6D97EB; } }
:root[data-theme="dark"] { --bg: #18191C; --card: #27282C; --ink: #F2F2F3; --sub: #A2A5AC; --hair: rgba(255,255,255,.12); --blue: #6D97EB; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.intro { max-width: 1120px; margin: 0 auto; padding: 28px 16px 4px; }
.intro h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; word-break: keep-all; }
.intro p { margin: 0 0 6px; color: var(--sub); font-size: 14px; line-height: 1.6; word-break: keep-all; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.toc a { text-decoration: none; color: var(--ink); background: var(--card); box-shadow: var(--sh); border-radius: 8px; padding: 7px 11px; font-size: 13px; font-weight: 700; }
.toc a i { font-style: normal; color: var(--blue); }
.item { max-width: 1120px; margin: 0 auto; padding: 28px 16px 8px; display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 16px 32px; align-items: start; scroll-margin-top: 8px; }
.item + .item { border-top: 1px solid var(--hair); }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; line-height: 1.35; }
.side h2 b { color: var(--blue); margin-right: 6px; }
.side .ask { margin: 0; font-size: 14px; color: var(--sub); line-height: 1.6; word-break: keep-all; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { height: 40px; min-width: 56px; padding: 0 14px; border-radius: 8px; background: var(--card); box-shadow: var(--sh); font-weight: 700; font-size: 14px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs.sm button { height: 32px; min-width: 0; padding: 0 11px; font-size: 12.5px; font-weight: 600; }
.tabs.sm button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.tabs.sm::before { content: attr(data-l); align-self: center; font-size: 12px; color: var(--sub); margin-right: 2px; }
.why { margin: 0; padding: 12px 14px; background: var(--card); border-radius: 10px; box-shadow: var(--sh); font-size: 13.5px; line-height: 1.65; word-break: keep-all; }
.why b { font-weight: 800; }
.why ul { margin: 6px 0 0; padding-left: 18px; } .why li { margin: 2px 0; }
.why .num { display: block; margin-top: 8px; font-size: 12.5px; color: var(--sub); }
.pick { display: flex; gap: 8px; }
.pick button { height: 42px; padding: 0 16px; border-radius: 8px; background: var(--card); font-weight: 700; font-size: 14px; box-shadow: var(--sh); white-space: nowrap; }
.pick button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.pick input { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--hair); background: var(--card); color: var(--ink); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 16px; }
.phone { position: relative; width: 100%; max-width: 390px; border-radius: 22px; overflow: hidden; box-shadow: 0 14px 34px -16px rgba(22,23,26,.45); border: 1px solid var(--hair); background: #EFEFF1; }
.phone iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; }
.phone .ld { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: #6B6E75; pointer-events: none; transition: opacity .2s; }
.phone.ok .ld { opacity: 0; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(22,23,26,.96); color: #fff; display: flex; gap: 10px; align-items: center; z-index: 5; }
.dock .s { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.45; word-break: keep-all; }
.dock button { background: var(--blue); color: #fff; border-radius: 8px; padding: 11px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.foot { height: 110px; }
@media (max-width: 760px) {
  .item { grid-template-columns: minmax(0, 1fr); padding: 24px 16px 8px; }
  .item .phone { order: 2; margin: 0 auto; }
  .item .side { display: contents; }
  .item .side > h2 { order: 0; } .item .side > .ask { order: 0; } .item .side > .tabs { order: 1; } .item .side > .why { order: 3; } .item .side > .pick { order: 4; }
}
</style>
</head>
<body>
<div class="intro">
  <h1>레퍼런스 10곳 — 앱에 넣기 전 확인할 3가지</h1>
  <p>진짜 앱을 폰 크기로 띄우고 바꿀 부분만 덮어씌웠어요. <b>지금 · A · B</b>를 눌러 비교하고, 안에서 스크롤·탭도 됩니다. 항목마다 하나 고르고 메모를 남긴 뒤 맨 아래 <b>답 복사</b>로 보내 주세요.</p>
  <p>이미 바로 넣은 것: '몇 번째예요?' 신호 막대 아이콘. 정리 문서 = 문서/여행앱/2026-11-22_VZTR_레퍼런스10_흡수할점_v1.</p>
  <div class="toc" id="toc"></div>
</div>
<main id="main"></main>
<div class="foot"></div>
<div class="dock"><div class="s" id="dockTx">아직 고른 안이 없어요</div><button id="copy">답 복사</button></div>
<script>
/* ---------- 항목별 시안 ---------- */
const R = px => (px / 16) + 'rem';   // 390폭 = 16px 기준 rem

// 한 줄 맞춤: 넘치면 글자를 0.5px씩 줄임 (앱의 #nextCard .nm 맞춤과 같은 방식)
function fitOne(doc, sel, minPx) {
  doc.querySelectorAll(sel).forEach(el => {
    el.style.removeProperty('font-size'); el.style.setProperty('white-space', 'nowrap', 'important');
    if (!el.clientWidth) return;
    let f = parseFloat(doc.defaultView.getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && f > minPx) { f -= 0.5; el.style.setProperty('font-size', f + 'px', 'important'); }
    if (el.scrollWidth > el.clientWidth + 1) el.style.removeProperty('white-space');   // 최소 크기에서도 넘치면 줄바꿈 허용
  });
}
function unfit(doc, sel) { doc.querySelectorAll(sel).forEach(el => { el.style.removeProperty('font-size'); el.style.removeProperty('white-space'); }); }

const CHAR_JS = big => d => {   // 질문 제목을 캐릭터 말풍선으로 (Duolingo). 캐릭터 = 내 유형(없으면 LSRP)
  const w = d.defaultView; if (!w.GABOJA_CHAR) return;
  d.querySelectorAll('.qh').forEach(q => {
    if (q.querySelector('.s5ask')) return;
    const h = q.querySelector('h1'); if (!h) return;
    let code = 'LSRP'; try { const t = JSON.parse(w.localStorage.getItem('gaboja-type') || 'null'); if (t && t.code) code = t.code; } catch (e) {}
    const box = d.createElement('div'); box.className = 's5ask' + (big ? ' big' : '');
    box.innerHTML = '<div class="s5av">' + w.GABOJA_CHAR(code, { bg: false }) + '</div><div class="s5bub"></div>';
    q.insertBefore(box, h); box.querySelector('.s5bub').appendChild(h);
    if (w.GABOJA_FIT) w.GABOJA_FIT(box.querySelector('svg'), 1.4);
  });
};
const CHAR_UNDO = d => d.querySelectorAll('.s5ask').forEach(b => { const h = b.querySelector('h1'); b.parentNode.insertBefore(h, b); b.remove(); });
const CHAR_CSS = big => `
  .s5ask { display: flex; ${big ? 'flex-direction: column; align-items: flex-start;' : 'align-items: flex-end;'} gap: ${R(10)}; }
  .s5av { flex: none; width: ${R(big ? 88 : 60)}; height: ${R(big ? 88 : 60)}; }
  .s5av svg { width: 100%; height: 100%; overflow: visible; }
  .s5bub { position: relative; min-width: 0; flex: 1; background: var(--tile); border: 1px solid var(--tile-edge); border-radius: ${R(16)}; padding: ${R(12)} ${R(14)}; box-shadow: var(--sh-xs); }
  .s5bub::before { content: ""; position: absolute; ${big ? `left: ${R(28)}; top: ${R(-7)}; border-left: 1px solid var(--tile-edge); border-top: 1px solid var(--tile-edge);` : `left: ${R(-7)}; bottom: ${R(16)}; border-left: 1px solid var(--tile-edge); border-bottom: 1px solid var(--tile-edge);`} width: ${R(12)}; height: ${R(12)}; background: var(--tile); transform: rotate(45deg); }
  .s5bub h1 { font-size: ${R(big ? 24 : 21)} !important; line-height: 1.3 !important; }`;
const ITEMS = [
{
  id: 'r1', no: '1', name: '질문을 캐릭터가 묻기 (Duolingo)',
  ask: '질문 제목을 내 유형 캐릭터의 말풍선으로. Duolingo 온보딩은 매 화면이 이 구조(캐릭터 + 말풍선 + 위 진행 막대 + 아래 버튼)였어요. 질문 10개와 정보 입력 화면 전체에 같은 틀로 들어갑니다.',
  screens: [
    { k: 'th', n: '주제·몇 번째', u: 'start.html?s=theme&city=%EC%84%9C%EC%9A%B8' },
    { k: 'q', n: '성향 질문', u: 'start.html?s=q3' },
    { k: 'who', n: '누구와', u: 'start.html?s=who' }
  ],
  v: {
    '0': { why: '<b>지금 앱 그대로.</b> 큰 제목(27px) + 회색 설명.' },
    A: { why: '<b>왼쪽 캐릭터 + 오른쪽 말풍선</b>(Duolingo 질문 화면과 같은 배치). 캐릭터 60px, 질문 21px. 제목이 말풍선에 들어가 한 덩어리로 보임.', css: CHAR_CSS(false), js: CHAR_JS(false) },
    B: { why: '<b>캐릭터 위 · 말풍선 아래</b>. 캐릭터 88px로 더 크게 보이고 질문 24px. 화면 위쪽 높이를 조금 더 씀.', css: CHAR_CSS(true), js: CHAR_JS(true) }
  },
  undo: CHAR_UNDO
},
{
  id: 'r2', no: '2', name: '버튼 바닥 선 — 눌리는 느낌 (Duolingo)',
  ask: '버튼과 선택지 아래에 한 단계 진한 띠를 붙여 "누를 수 있는 두께"를 보여 주는 방식. 그림자·광택이 아니라 평면 색 띠예요. 취향 프로파일(입체 효과 X)과 부딪칠 수 있어 직접 보고 정해 주세요.',
  screens: [
    { k: 'th', n: '주제·몇 번째', u: 'start.html?s=theme&city=%EC%84%9C%EC%9A%B8' },
    { k: 'm', n: '일정 방식', u: 'start.html?s=method' }
  ],
  v: {
    '0': { why: '<b>지금 앱 그대로.</b> 평평한 버튼 + 아주 옅은 그림자.' },
    A: { why: '<b>바닥 띠 3px.</b> 다음 버튼 = 잉크보다 진한 띠, 선택지 = 회색 띠. 누르면 띠가 사라지며 1.5px 내려앉음.',
      css: `.cta { box-shadow: 0 ${R(3)} 0 #000 !important; } .cta:active { transform: translateY(${R(1.5)}) !important; box-shadow: 0 ${R(1.5)} 0 #000 !important; }
        .two button, .pk { box-shadow: 0 ${R(3)} 0 var(--tile-edge) !important; } .two button:active, .pk:active { transform: translateY(${R(1.5)}) !important; box-shadow: 0 ${R(1.5)} 0 var(--tile-edge) !important; }
        .two button[aria-pressed="true"] { box-shadow: 0 ${R(3)} 0 #000 !important; }` },
    B: { why: '<b>바닥 띠 1.5px — 아주 은은하게.</b> 평평한 인상은 거의 그대로, 누를 수 있다는 힌트만.',
      css: `.cta { box-shadow: 0 ${R(1.5)} 0 #000 !important; } .two button, .pk { box-shadow: 0 ${R(1.5)} 0 var(--tile-edge) !important; } .two button[aria-pressed="true"] { box-shadow: 0 ${R(1.5)} 0 #000 !important; }` }
  }
},
{
  id: 'r3', no: '3', name: '장소 카드 — 사진 위 칩을 아래로 (Pentagram·Airbnb)',
  ask: '⚠️ 영업시간을 사진 위 종류 칩 옆에 두는 건 11/20 동우님 결정이에요. 레퍼런스는 "사진 위엔 아무것도 얹지 않고 아래 캡션 줄로"를 권해서, 바꿀지 그대로 둘지 직접 보고 정해 주세요.',
  screens: [{ k: 'sw', n: '장소 고르기', u: 'start.html?s=swipe&type=HSFP&city=%EC%84%9C%EC%9A%B8' }],
  v: {
    '0': { why: '<b>지금 앱 그대로 (11/20 결정).</b> 사진 왼쪽 위 검정 칩 = 종류 | 영업시간.' },
    A: { why: '<b>칩을 사진 아래 첫 줄로.</b> 회색 작은 글자 "쇼핑 · 10:00–22:00" → 이름 → 설명 → ★. 사진엔 크레딧만.',
      css: `.swinf .swkd.s5mv { position: static !important; background: none !important; color: var(--sub) !important; padding: 0 !important; margin: 0 0 ${R(2)} !important; font-size: ${R(12)} !important; font-weight: 600 !important; } .swinf .swkd.s5mv .h { border-left-color: var(--hair) !important; } .swinf .swkd.s5mv svg { stroke: var(--sub) !important; }`,
      js: d => d.querySelectorAll('.swc').forEach(c => { const k = c.querySelector('.swph .swkd'), i = c.querySelector('.swinf'); if (k && i) { k.classList.add('s5mv'); i.prepend(k); } }) },
    B: { why: '<b>사진 위 칩은 그대로 두되 반투명 흰 바탕으로 가볍게.</b> 위치는 11/20 결정 유지, 사진을 덜 가림.',
      css: `.swph .swkd { background: rgba(255,255,255,.82) !important; color: #16171A !important; backdrop-filter: blur(6px); } .swph .swkd .h { border-left-color: rgba(22,23,26,.2) !important; } .swph .swkd svg { stroke: #16171A !important; }` }
  },
  undo: d => d.querySelectorAll('.swkd.s5mv').forEach(k => { const p = k.closest('.swc').querySelector('.swph'); k.classList.remove('s5mv'); p && p.appendChild(k); })
}
];
/* ---------- 저장 · 그리기 ---------- */
const KEY = 'vztr-ref10-v1'; let S = { pick: {}, memo: {}, cur: {}, scr: {}, opt: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
['pick', 'memo', 'cur', 'scr', 'opt'].forEach(k => S[k] = S[k] || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} dock(); };
const VN = { '0': '지금', A: 'A', B: 'B' };

document.getElementById('toc').innerHTML = ITEMS.map(it => `<a href="#${it.id}"><i>${it.no}</i> ${it.name.split(' — ')[0].split(' ·')[0]}</a>`).join('');
const main = document.getElementById('main');
main.innerHTML = ITEMS.map(it => `
<section class="item" id="${it.id}">
  <div class="phone" data-ph><div class="ld">불러오는 중…</div><iframe title="${it.no} 미리보기" loading="lazy"></iframe></div>
  <div class="side">
    <h2><b>${it.no}</b>${it.name}</h2>
    <p class="ask">${it.ask}</p>
    <div class="tabs" data-v>${['0', 'A', 'B'].map(k => `<button data-k="${k}">${VN[k]}</button>`).join('')}</div>
    ${it.screens.length > 1 ? `<div class="tabs sm" data-l="화면" data-s>${it.screens.map(s => `<button data-k="${s.k}">${s.n}</button>`).join('')}</div>` : ''}
    ${(it.opts || []).map(o => `<div class="tabs sm" data-l="${o.l}" data-o="${o.k}">${o.o.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('')}</div>`).join('')}
    <div class="why" data-why></div>
    <div class="pick"><button data-pick>이걸로</button><input data-memo placeholder="${it.no} 메모"></div>
  </div>
</section>`).join('');

ITEMS.forEach(it => {
  const sec = document.getElementById(it.id), ph = sec.querySelector('[data-ph]'), fr = ph.querySelector('iframe');
  if (!S.cur[it.id]) S.cur[it.id] = '0';
  if (!S.scr[it.id]) S.scr[it.id] = it.screens[0].k;
  S.opt[it.id] = S.opt[it.id] || {}; (it.opts || []).forEach(o => { if (!S.opt[it.id][o.k]) S.opt[it.id][o.k] = o.o[0][0]; });
  let ready = false, mo = null, tm = null;

  const scr = () => it.screens.find(s => s.k === S.scr[it.id]) || it.screens[0];
  const width = () => +((S.opt[it.id] || {}).w || 390);
  function scale() {
    const W = width(), cs = getComputedStyle(sec), avail = Math.min(sec.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), 390);
    const s = Math.min(1, avail / W); fr.style.width = W + 'px'; fr.style.transform = `scale(${s})`;
    ph.style.maxWidth = (W * s) + 'px'; ph.style.height = (844 * s) + 'px';
  }
  function url() {
    let u = scr().u;
    if ((S.opt[it.id] || {}).when === 'pre') u = u.replace(/now=[^&#]+&?/, '').replace('?#', '#');
    return u;
  }
  function load() { ready = false; ph.classList.remove('ok'); if (mo) mo.disconnect(); scale(); fr.src = url(); }
  fr.addEventListener('load', () => {
    const d = fr.contentDocument; if (!d) return;
    setTimeout(() => {
      try {
        const s = scr();
        if (s.setup) s.setup(d);
        setTimeout(() => {
          
          ready = true; apply(); if (s.scroll) setTimeout(() => fr.contentWindow.scrollTo(0, s.scroll(d)), 150); ph.classList.add('ok');
          mo = new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(rerun, 120); });
          mo.observe(d.body, { childList: true, subtree: true });
        }, s.setup ? 900 : 200);
      } catch (e) { console.warn(e); ph.classList.add('ok'); }
    }, 1300);
  });
  function rerun() { const v = it.v[S.cur[it.id]], d = fr.contentDocument; if (!d) return; mo && mo.disconnect(); try { it.prep && it.prep(d); v.js && v.js(d); } catch (e) {} meas(); mo && mo.observe(d.body, { childList: true, subtree: true }); }
  function meas() {
    const box = sec.querySelector('[data-why] [data-m]'); if (!box || !it.measure) return;
    try { box.textContent = it.measure(fr.contentDocument); } catch (e) {}
  }
  function apply() {
    const d = fr.contentDocument, v = it.v[S.cur[it.id]];
    sec.querySelector('[data-why]').innerHTML = v.why;
    if (!ready || !d) return;
    mo && mo.disconnect();
    try { it.undo && it.undo(d); } catch (e) {}
    let st = d.getElementById('s4css'); if (!st) { st = d.createElement('style'); st.id = 's4css'; d.head.appendChild(st); }
    st.textContent = v.css || '';
    try { it.prep && it.prep(d); v.js && v.js(d); } catch (e) { console.warn(e); }
    setTimeout(meas, 60);
    mo && mo.observe(d.body, { childList: true, subtree: true });
  }
  function draw() {
    sec.querySelectorAll('[data-v] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.cur[it.id]));
    sec.querySelectorAll('[data-s] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.scr[it.id]));
    sec.querySelectorAll('[data-o]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.opt[it.id][g.dataset.o])));
    const pk = sec.querySelector('[data-pick]'), cur = S.cur[it.id];
    pk.setAttribute('aria-pressed', S.pick[it.id] === cur); pk.textContent = S.pick[it.id] === cur ? `✓ ${VN[cur]} 골랐어요` : `${VN[cur]}(으)로`;
  }
  sec.querySelectorAll('[data-v] button').forEach(b => b.onclick = () => { S.cur[it.id] = b.dataset.k; save(); draw(); apply(); });
  sec.querySelectorAll('[data-s] button').forEach(b => b.onclick = () => { S.scr[it.id] = b.dataset.k; save(); draw(); load(); });
  sec.querySelectorAll('[data-o]').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => { S.opt[it.id][g.dataset.o] = b.dataset.k; save(); draw(); load(); }));
  const pk = sec.querySelector('[data-pick]'), mm = sec.querySelector('[data-memo]');
  pk.onclick = () => { const c = S.cur[it.id]; S.pick[it.id] = S.pick[it.id] === c ? '' : c; save(); draw(); };
  mm.value = S.memo[it.id] || ''; mm.oninput = () => { S.memo[it.id] = mm.value; save(); };
  addEventListener('resize', scale);
  draw(); sec.querySelector('[data-why]').innerHTML = it.v[S.cur[it.id]].why; load();
});

function dock() {
  const p = ITEMS.filter(it => S.pick[it.id]).map(it => it.no + ' ' + VN[S.pick[it.id]]);
  document.getElementById('dockTx').textContent = p.length ? `고름 ${p.length}/${ITEMS.length}: ` + p.join(' · ') : '아직 고른 안이 없어요';
}
dock();
document.getElementById('copy').onclick = function () {
  const L = ['[VZTR 레퍼런스 적용 시안]'];
  ITEMS.forEach(it => { L.push(`${it.no} ${it.name}: ${S.pick[it.id] ? VN[S.pick[it.id]] : '안 고름'}${S.memo[it.id] ? ' — ' + S.memo[it.id] : ''}`); });
  const t = L.join('\n'), btn = this, ok = () => { btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = '답 복사', 1600); };
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) {} a.remove(); };
  navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(ok, fb) : fb();
};
</script>
</body>
