<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발급 탑승권 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2"); }
:root {
  color-scheme: light;
  --kr: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --lat: "Inter Tight", var(--kr);
  --canvas: #EEF0F3; --ink: #0A1F33; --sub: #5B6B7A; --hair: rgba(10,31,51,.09); --paper: #FFFFFF; --field: #FFFFFF;
  --blue: #2F5BFF; --on-blue: #FFFFFF; --blue-soft: rgba(47,91,255,.09); --green: #2F9E6E; --amber: #E8912A; --red: #CF3F66;
  --flap: #1B1E23; --flap-tx: #F4F5F7;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(24,36,60,.32), 0 2px 0.375rem -2px rgba(24,36,60,.10);
  --sh-xs: 0 1px 2px rgba(24,36,60,.06), 0 0.25rem 0.75rem -0.375rem rgba(24,36,60,.14);
  --r-lg: 1.625rem; --r-md: 1.25rem;
  --bgsoft: radial-gradient(60% 40% at 12% 8%, rgba(255,255,255,.95), transparent 70%), radial-gradient(50% 35% at 90% 30%, rgba(214,220,229,.55), transparent 70%), #EEF0F3;
  --gmix: 100%;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark; --canvas: #0E1013; --ink: #ECEEF1; --sub: #8F969F; --hair: rgba(255,255,255,.08); --paper: #1B1E23; --field: #15181C;
  --blue: #7C95FF; --on-blue: #0A1F33; --blue-soft: rgba(124,149,255,.12); --green: #4CC08E; --amber: #F0A84A; --red: #F06A8A; --flap: #05070A;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(0,0,0,.7), 0 2px 0.375rem -2px rgba(0,0,0,.4); --sh-xs: 0 1px 2px rgba(0,0,0,.3), 0 0.25rem 0.75rem -0.375rem rgba(0,0,0,.5);
  --bgsoft: radial-gradient(60% 40% at 12% 8%, rgba(255,255,255,.05), transparent 70%), #0E1013; --gmix: 26%;
} }
:root[data-theme="dark"] {
  color-scheme: dark; --canvas: #0E1013; --ink: #ECEEF1; --sub: #8F969F; --hair: rgba(255,255,255,.08); --paper: #1B1E23; --field: #15181C;
  --blue: #7C95FF; --on-blue: #0A1F33; --blue-soft: rgba(124,149,255,.12); --green: #4CC08E; --amber: #F0A84A; --red: #F06A8A; --flap: #05070A;
  --shadow: 0 1.375rem 2.75rem -1.375rem rgba(0,0,0,.7), 0 2px 0.375rem -2px rgba(0,0,0,.4); --sh-xs: 0 1px 2px rgba(0,0,0,.3), 0 0.25rem 0.75rem -0.375rem rgba(0,0,0,.5);
  --bgsoft: radial-gradient(60% 40% at 12% 8%, rgba(255,255,255,.05), transparent 70%), #0E1013; --gmix: 26%;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--canvas); }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--kr); font-size: 15px; line-height: 1.5; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 보드 */
.board { max-width: 1320px; margin: 0 auto; padding: 20px 16px 140px; }
.board > h1 { margin: 4px 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
.lead { margin: 0 0 14px; color: var(--sub); font-size: 13.5px; } .lead b { color: var(--ink); }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 18px; font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 18px; background: var(--hair); }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--sh-xs); }
.ctl .lb { font-weight: 700; color: var(--sub); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 410px), 1fr)); gap: 28px 20px; align-items: start; }
.opt { display: flex; flex-direction: column; gap: 10px; }
.opt h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; display: flex; gap: 8px; align-items: baseline; }
.opt h2 .k { font-family: var(--lat); font-weight: 800; color: var(--blue); }
.opt ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--sub); } .opt ul b { color: var(--ink); font-weight: 600; }
.frame { width: min(390px, 100%); height: 760px; margin: 0 auto; border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 8px #1B1E23, 0 0 0 9px #3A3F47, var(--shadow); position: relative; }
.frame .scr { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.acts { display: flex; gap: 8px; justify-content: center; }
.acts a { font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--paper); box-shadow: var(--sh-xs); color: var(--ink); text-decoration: none; }
.pk { background: var(--paper); border-radius: var(--r-md); padding: 12px; box-shadow: var(--sh-xs); display: flex; flex-direction: column; gap: 8px; }
.pk .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pk .row button { padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--hair); color: var(--sub); }
.pk .row button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
.pk .q { font-size: 13px; font-weight: 700; }
textarea { width: 100%; resize: vertical; border: 1px solid var(--hair); background: var(--field); color: var(--ink); border-radius: 12px; padding: 8px 10px; font: 13px/1.45 var(--kr); }
.common { margin-top: 30px; display: grid; gap: 12px; max-width: 760px; } .common h2 { margin: 0; font-size: 17px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--canvas) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: flex; gap: 10px; justify-content: center; align-items: center; border-top: 1px solid var(--hair); z-index: 50; }
.dock button { padding: 11px 18px; border-radius: 999px; background: var(--blue); color: var(--on-blue); font-weight: 700; font-size: 14px; }
.dock span { font-size: 12.5px; color: var(--sub); }
#out { position: absolute; left: -9999px; }

/* ---------- 발급 완료 공통 ---------- */
.dn { min-height: 100%; background: var(--bgsoft); display: flex; flex-direction: column; }
.dn .in { flex: 1; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.dn .bar { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; align-items: center; gap: 6px; height: 40px; }
.dn .bar .bk { width: 36px; height: 36px; display: grid; place-items: center; }
.dn .bar .pg { display: flex; gap: 4px; } .dn .bar .pg i { flex: 1; height: 4px; border-radius: 4px; background: var(--blue); }
.dn .bar .t { font-size: 12.5px; font-weight: 600; color: var(--sub); }
.vz { font-family: "Inter Tight", var(--kr); font-weight: 800; letter-spacing: -.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
.vz i { display: inline-block; width: .2em; height: .2em; border-radius: 50%; background: var(--blue); margin-left: .12em; }
.tk { border-radius: var(--r-lg); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; position: relative; }
.tk .hd { padding: 16px 18px 0; display: flex; justify-content: space-between; align-items: center; font: 700 10.5px var(--lat); letter-spacing: .1em; color: var(--sub); }
.tk .hd .vz { font-size: 17px; letter-spacing: -.035em; }
.tk .hd .ok { display: inline-flex; gap: 4px; align-items: center; color: var(--green); font: 700 12px var(--kr); letter-spacing: 0; }
.tk .hd .ok .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.perf { position: relative; height: 18px; }
.perf::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; border-top: 2px dashed var(--hair); }
.perf::after { content: ""; position: absolute; inset: 0 -9px; background: radial-gradient(circle at 0 50%, var(--canvas) 9px, transparent 9.5px), radial-gradient(circle at 100% 50%, var(--canvas) 9px, transparent 9.5px); }
.city { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.045em; line-height: 1.15; }
.av { display: flex; align-items: flex-end; justify-content: center; }
.av svg { height: 100%; width: auto; }
.rows { padding: 0 18px 6px; }
.rows .r { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); align-items: baseline; font-size: 14.5px; }
.rows .r:first-child { border-top: 0; }
.rows .r > span { font-size: 12.5px; font-weight: 600; color: var(--sub); }
.rows .r b { font-weight: 600; } .rows .r b em { font-style: normal; color: var(--sub); font-weight: 500; }
.flaps { display: flex; gap: 3px; } .fl { width: 22px; height: 29px; border-radius: 5px; background: var(--flap); color: var(--flap-tx); display: grid; place-items: center; font: 700 15px var(--lat); position: relative; }
.fl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.55); }
.sent { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 600; background: var(--blue-soft); color: var(--blue); }
.who { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--hair); font-size: 13px; font-weight: 600; }
.who .ic { width: 15px; height: 15px; }
/* 아래 고정 (I51b) */
.foot { position: sticky; bottom: 0; z-index: 5; padding: 12px 16px calc(12px + var(--sab, 0px)); background: linear-gradient(transparent, var(--canvas) 26%); }
.cta { width: 100%; height: 54px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.cta .ic { width: 20px; height: 20px; stroke-width: 2.2; }
.cta2 { height: 54px; padding: 0 18px; border-radius: 999px; background: var(--paper); box-shadow: var(--sh-xs); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); }
.cta2 .ic { width: 17px; height: 17px; }

/* ----- A: 날짜 두 칸 + D-day ----- */
.vA .top { padding: 12px 18px 14px; display: grid; grid-template-columns: minmax(0,1fr) 104px; gap: 10px; align-items: center; }
.vA .top .av { width: 104px; height: 104px; }
.vA .top .l { display: flex; flex-direction: column; gap: 8px; }
.vA .dates { margin: 0 18px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; background: var(--canvas); border-radius: 16px; padding: 12px 14px; }
.vA .dates .d { display: flex; flex-direction: column; } .vA .dates .d.e { align-items: flex-end; text-align: right; }
.vA .dates small { font-size: 11.5px; font-weight: 600; color: var(--sub); }
.vA .dates b { font: 800 22px var(--lat); letter-spacing: -.02em; } .vA .dates b span { font: 700 15px var(--kr); margin-left: 4px; color: var(--sub); }
.vA .dates .mid { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--blue); }
.vA .dates .mid svg { width: 46px; height: 12px; stroke: var(--blue); fill: none; stroke-width: 1.6; stroke-linecap: round; }
.vA .dday { margin: 0 18px 16px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--hair); }
.vA .dday .n { font: 800 26px/1 var(--lat); color: var(--blue); letter-spacing: -.03em; }
.vA .dday p { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.4; } .vA .dday p b { color: var(--ink); }
.vA .dday button { font-size: 12.5px; font-weight: 700; padding: 8px 11px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.vA .dday button .ic { width: 15px; height: 15px; }
.vA .foot .cta + .lk { display: block; margin: 6px auto 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--sub); padding: 8px; }

/* ----- B: 캐릭터가 표 위로 + QR ----- */
.vB .peek { height: 92px; display: flex; justify-content: center; margin-bottom: -26px; position: relative; z-index: 2; }
.vB .peek .av { height: 118px; width: 118px; margin-top: -26px; }
.vB .tk { padding-top: 14px; }
.vB .tk .hd { padding-top: 20px; }
.vB .mid { padding: 10px 18px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vB .mid .ln { font-size: 15px; font-weight: 600; } .vB .mid .ln span { color: var(--sub); font-weight: 500; }
.vB .qr { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; align-items: center; padding: 6px 18px 18px; }
.vB .qr .q { width: 96px; height: 96px; padding: 6px; background: #fff; border-radius: 12px; border: 1px solid var(--hair); }
.vB .qr .q img, .vB .qr .q canvas { width: 100% !important; height: 100% !important; display: block; }
.vB .qr b { display: block; font-size: 14.5px; } .vB .qr p { margin: 3px 0 0; font-size: 12.5px; color: var(--sub); line-height: 1.45; }
.vB .foot .two { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; }

/* ----- C: 출발·도착 탑승권 + 다음 할 일 ----- */
.vC .tk .hd .ed { font: 600 13px var(--kr); letter-spacing: 0; color: var(--ink); display: inline-flex; gap: 4px; align-items: center; padding: 4px 8px; margin: -4px -8px; border-radius: 999px; }
.vC .tk .hd .ed .ic { width: 15px; height: 15px; }
.vC .top { padding: 10px 18px 4px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.vC .top .av { width: 84px; height: 84px; }
.vC .ft { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; padding: 10px 18px 16px; }
.vC .ft small { display: block; font: 700 10.5px var(--lat); letter-spacing: .1em; color: var(--sub); }
.vC .ft b { display: block; font: 800 26px/1.1 var(--lat); letter-spacing: -.02em; }
.vC .ft span { font-size: 13px; font-weight: 600; color: var(--sub); }
.vC .ft .e { text-align: right; }
.vC .ft .mid { align-self: center; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; color: var(--sub); gap: 2px; }
.vC .ft .mid svg { width: 22px; height: 22px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linejoin: round; transform: rotate(90deg); }
.vC .todo { padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
.vC .todo h4 { margin: 0; font: 700 10.5px var(--lat); letter-spacing: .1em; color: var(--sub); }
.vC .todo .t { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.vC .todo .t .bx { width: 22px; height: 22px; border-radius: 7px; border: 1.8px solid var(--hair); display: grid; place-items: center; }
.vC .todo .t.dn2 .bx { background: var(--green); border-color: var(--green); } .vC .todo .t.dn2 .bx .ic { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; }
.vC .todo .t.dn2 b { color: var(--sub); text-decoration: line-through; font-weight: 500; }
.vC .todo .t b { font-weight: 600; } .vC .todo .t button { font-size: 12.5px; font-weight: 700; color: var(--blue); }

html.solo .board, html.solo .dock { display: none; }
html.solo .dn { min-height: 100dvh; --sab: env(safe-area-inset-bottom, 0px); }
html.solo .dn .in { padding-top: calc(10px + env(safe-area-inset-top)); }
</style>
</head>
<body>
<div id="soloHost"></div>
<main class="board">
  <h1>D-3 · 발급 완료 탑승권 시안</h1>
  <p class="lead">피드백 <b>I47 캐릭터 · I49 날짜·동행 표기 · I50 바코드 → 실용적인 것 · I51b 아래 버튼 고정 · I52 ‘내 일정 보기 →’ 화살표·수정하기 정렬</b>을 반영한 3안입니다. D-2 결정대로 캐릭터는 배경 칸 없이 캐릭터만 크게 넣었습니다. 폰 안에서 스크롤하면 아래 버튼이 따라오는지 볼 수 있습니다.</p>
  <div class="ctl"><span class="lb">화면</span><div class="seg" id="thSeg"><button data-t="light" aria-pressed="true">라이트</button><button data-t="dark">다크</button></div></div>
  <div class="grid" id="grid"></div>
  <section class="common">
    <h2>공통으로 여쭤볼 것</h2>
    <div class="pk" data-q="bc"><span class="q">바코드 자리 (I50) — 어떤 게 제일 쓸모 있을까요? (여러 안에서 섞어도 됩니다)</span>
      <div class="row"><button data-a="D-day + 캘린더(A)">D-day + 캘린더(A)</button><button data-a="QR로 같이 보기(B)">QR로 같이 보기(B)</button><button data-a="다음 할 일(C)">다음 할 일(C)</button></div>
      <textarea rows="1" placeholder="메모 (선택)"></textarea></div>
    <div class="pk" data-q="all"><span class="q">전체 메모</span><textarea rows="3" placeholder="섞고 싶은 부분, 이상한 곳 등"></textarea></div>
  </section>
</main>
<div class="dock"><span id="cnt">고른 것 0</span><button id="copy">답 복사하기</button></div>
<textarea id="out" readonly></textarea>

<script>
function loadJs(n) { return new Promise(r => { const s = document.createElement('script'); s.src = n; s.onload = () => r(true); s.onerror = () => { const t = document.createElement('script'); t.src = '../app/' + n; t.onload = () => r(true); t.onerror = () => r(false); document.head.appendChild(t); }; document.head.appendChild(s); }); }
Promise.all([loadJs('chars.js'), loadJs('types.js')]).then(main);

function main() {
const $ = (s, r = document) => r.querySelector(s), all = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'vztr-d3-pass-v1';
const CODE = 'LEFJ', TY = (window.GABOJA_TYPES || {})[CODE] || { name: '맛집 지도 제작자', group: '취향 수집형' };
/* 예시 여행 (시안용) */
const TR = { city: '오사카·교토', s: { md: '11. 16', wd: '월', en: 'MON' }, e: { md: '11. 19', wd: '목', en: 'THU' }, nights: '3박 4일', who: '연인', method: '추천 받아서 내가 고를래요', home: '서울 송파구', book: '비행기 미정 · 숙소 난바 쪽', likes: '맛집 · 카페', to: '카카오톡', dday: 16 };
const GUIDE = 'https://larchive.page/gaboja/index.html#sample';
const I = {
  arrow: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  edit: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M12 13v4M10 15h4"/></svg>',
  heart: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  back: '<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  send: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg>',
  plane: '<svg viewBox="0 0 24 24"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>',
  share: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>' };
const CH = (cls) => `<div class="av ${cls || ''}">${window.GABOJA_CHAR ? GABOJA_CHAR(CODE, { bg: false }) : ''}</div>`;
const flaps = `<div class="flaps">${CODE.split('').map(l => `<span class="fl">${l}</span>`).join('')}</div>`;
const bar = `<div class="bar"><span class="bk">${I.back}</span><div class="pg"><i></i><i></i><i></i><i></i></div><span class="t">발급 완료</span></div>`;
const rows = (list) => `<div class="rows">${list.map(([k, v]) => `<div class="r"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
const sent = `<div class="sent">${I.send}<span>신청 완료! 가이드북은 ${TR.to}으로 보내 드릴게요</span></div>`;

const V = {
  A: { t: '날짜 두 칸 + D-day', pts: ['<b>I47</b> 캐릭터 = 도시 이름 오른쪽(배경 없이)', '<b>I49</b> 가는 날·오는 날 두 칸 + 가운데 ‘3박 4일’ · 동행은 하트 칩 ‘연인과’', '<b>I50</b> 바코드 → ‘출발까지 D-16’ + 캘린더에 넣기', '<b>I51b·I52</b> 아래 고정 = ‘내 일정 보기 →’ 한 줄(글자+화살표 가운데) · 수정하기는 그 아래 글자 버튼'],
    html: () => `<div class="in">${bar}<article class="tk">
      <div class="hd"><b class="vz">vztr<i></i></b><span class="ok">${I.check}발급 완료</span></div>
      <div class="top"><div class="l"><h1 class="city">${TR.city}</h1><span class="who" style="align-self:flex-start">${I.heart}${TR.who}과</span></div>${CH()}</div>
      <div class="dates"><div class="d"><small>가는 날</small><b>${TR.s.md}<span>${TR.s.wd}</span></b></div><div class="mid"><svg viewBox="0 0 46 12"><path d="M1 6h42M38 1.5L43 6l-5 4.5"/></svg>${TR.nights}</div><div class="d e"><small>오는 날</small><b>${TR.e.md}<span>${TR.e.wd}</span></b></div></div>
      <div class="dday"><span class="n">D-${TR.dday}</span><p><b>출발까지 ${TR.dday}일</b><br>그때까지 가이드북이 와요</p><button>${I.cal}캘린더</button></div>
      <div class="perf"></div>
      ${rows([['유형', `${esc(TY.name)} <em>${CODE}</em>`], ['일정', TR.method], ['출발', TR.home], ['예약', TR.book], ['취향', TR.likes]])}
      </article>${sent}</div>
      <div class="foot"><button class="cta">내 일정 보기${I.arrow}</button><button class="lk">수정하기</button></div>` },
  B: { t: '캐릭터가 표 위로 + QR', pts: ['<b>I47</b> 캐릭터가 탑승권 위로 살짝 올라앉음(가장 크게)', '<b>I49</b> 한 줄: ‘11. 16 월 – 11. 19 목’ 아래 ‘3박 4일 · 연인과’', '<b>I50</b> 바코드 → 진짜 QR: 같이 가는 사람이 찍으면 같은 가이드북이 열림 (실제 공유는 서버 묶음 W8 뒤에 동작)', '<b>I51b·I52</b> 아래 고정 = [수정하기] [내 일정 보기 →] 나란히, 같은 높이'],
    html: () => `<div class="in">${bar}<div class="peek">${CH()}</div><article class="tk">
      <div class="hd"><b class="vz">vztr<i></i></b><span class="ok">${I.check}발급 완료</span></div>
      <div class="mid"><h1 class="city">${TR.city}</h1><div class="ln">${TR.s.md} ${TR.s.wd} – ${TR.e.md} ${TR.e.wd}</div><div class="ln"><span>${TR.nights} · ${TR.who}과</span></div></div>
      <div class="perf"></div>
      ${rows([['유형', `${esc(TY.name)} <em>${CODE}</em>`], ['일정', TR.method], ['출발', TR.home], ['예약', TR.book], ['취향', TR.likes]])}
      <div class="perf"></div>
      <div class="qr"><div class="q" data-qr></div><div><b>같이 가는 사람에게</b><p>이 QR을 폰 카메라로 찍으면 같은 가이드북이 열려요</p></div></div>
      </article>${sent}</div>
      <div class="foot"><div class="two"><button class="cta2">${I.edit}수정하기</button><button class="cta">내 일정 보기${I.arrow}</button></div></div>` },
  C: { t: '출발·도착 탑승권 + 다음 할 일', pts: ['<b>I47</b> 캐릭터 = 도시 이름 오른쪽(작게) · 코드 글자 칸 옆', '<b>I49</b> 항공권처럼 FROM 11.16 월 ✈ TO 11.19 목 · 가운데 ‘3박 4일’ · 동행은 유형 줄에', '<b>I50</b> 바코드 → ‘다음 할 일’ 체크 목록(비행기·숙소 정하기 등, 누르면 그 질문으로)', '<b>I51b·I52</b> 아래 고정 = ‘내 일정 보기 →’ 하나만 · 수정하기는 탑승권 오른쪽 위 연필'],
    html: () => `<div class="in">${bar}<article class="tk">
      <div class="hd"><b class="vz">vztr<i></i></b><button class="ed">${I.edit}수정</button></div>
      <div class="top"><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12.5px;font-weight:700;color:var(--green);display:inline-flex;gap:4px;align-items:center">${I.check.replace('class="ic"', 'class="ic" style="width:15px;height:15px;stroke-width:2.6"')}발급 완료</span><h1 class="city">${TR.city}</h1>${flaps}</div>${CH()}</div>
      <div class="ft"><div><small>FROM</small><b>${TR.s.md}</b><span>${TR.s.wd}요일</span></div><div class="mid">${I.plane}${TR.nights}</div><div class="e"><small>TO</small><b>${TR.e.md}</b><span>${TR.e.wd}요일</span></div></div>
      <div class="perf"></div>
      ${rows([['동행', `${TR.who} <em>· ${esc(TY.name)}</em>`], ['일정', TR.method], ['출발', TR.home], ['취향', TR.likes]])}
      <div class="perf"></div>
      <div class="todo"><h4>NEXT · 다음 할 일</h4>
        <div class="t dn2"><span class="bx">${I.check}</span><b>여행 성향 알아보기</b><span></span></div>
        <div class="t dn2"><span class="bx">${I.check}</span><b>날짜·동행 정하기</b><span></span></div>
        <div class="t"><span class="bx"></span><b>비행기 시각 넣기</b><button>넣기</button></div>
        <div class="t"><span class="bx"></span><b>숙소 정하기 <em style="font-style:normal;color:var(--sub);font-weight:500">· 지금 난바 쪽</em></b><button>정하기</button></div>
      </div></article>${sent}</div>
      <div class="foot"><button class="cta">내 일정 보기${I.arrow}</button></div>` }
};
function render(host, v) { host.innerHTML = `<div class="dn v${v}">${V[v].html()}</div>`; const q = host.querySelector('[data-qr]'); if (q && window.QRCode) { try { new QRCode(q, { text: GUIDE, width: 168, height: 168, colorDark: '#0A1F33', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (_) {} } }

const qs = new URLSearchParams(location.search), solo = qs.get('v');
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
const theme = t => { document.documentElement.dataset.theme = t; all('#thSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t)); };
if (qs.get('t')) theme(qs.get('t')); else if (matchMedia('(prefers-color-scheme: dark)').matches) theme('dark');
if (solo && V[solo]) { document.documentElement.classList.add('solo'); render($('#soloHost'), solo); return; }

$('#grid').innerHTML = Object.keys(V).map(k => `<section class="opt"><h2><span class="k">${k}</span>${V[k].t}</h2><ul>${V[k].pts.map(x => `<li>${x}</li>`).join('')}</ul>
  <div class="frame"><div class="scr" data-host="${k}"></div></div>
  <div class="acts"><a href="?v=${k}" target="_blank" rel="noopener">폰 전체 화면으로</a></div>
  <div class="pk" data-q="${k}"><div class="row"><button data-a="이걸로">이걸로</button><button data-a="섞어서">일부만 가져가기</button><button data-a="별로">별로</button></div><textarea rows="2" placeholder="메모 (선택) — 예: 날짜는 C처럼"></textarea></div></section>`).join('');
all('[data-host]').forEach(h => render(h, h.dataset.host));
$('#thSeg').onclick = e => { const b = e.target.closest('[data-t]'); if (b) theme(b.dataset.t); };

const drawPk = () => { all('.pk').forEach(p => { const o = st[p.dataset.q] || {}; all('.row button', p).forEach(b => b.setAttribute('aria-pressed', o.a === b.dataset.a)); const t = $('textarea', p); if (document.activeElement !== t) t.value = o.m || ''; });
  $('#cnt').textContent = '고른 것 ' + Object.values(st).filter(o => o.a || o.m).length; };
all('.pk').forEach(p => { const q = p.dataset.q;
  p.addEventListener('click', e => { const b = e.target.closest('.row button'); if (!b) return; const o = st[q] = st[q] || {}; o.a = o.a === b.dataset.a ? '' : b.dataset.a; save(); drawPk(); });
  $('textarea', p).addEventListener('input', e => { (st[q] = st[q] || {}).m = e.target.value; save(); drawPk(); }); });
drawPk();
const NAME = { A: 'A 날짜 두 칸 + D-day', B: 'B 캐릭터 위 + QR', C: 'C 출발·도착 + 다음 할 일', bc: '바코드 자리', all: '전체 메모' };
$('#copy').onclick = async () => {
  const lines = ['[D-3 발급 탑승권 시안 답]'];
  Object.keys(NAME).forEach(q => { const o = st[q]; if (!o || !(o.a || o.m)) return; lines.push(`- ${NAME[q]}: ${[o.a, o.m].filter(Boolean).join(' / ')}`); });
  if (lines.length === 1) lines.push('- (아직 고른 것 없음)');
  const tx = lines.join('\n'); let ok = false;
  try { await navigator.clipboard.writeText(tx); ok = true; } catch (_) { const o = $('#out'); o.value = tx; o.removeAttribute('readonly'); o.select(); try { ok = document.execCommand('copy'); } catch (_) {} o.setAttribute('readonly', ''); }
  $('#copy').textContent = ok ? '복사했어요 · 채팅에 붙여 주세요' : '복사 실패 — 길게 눌러 복사';
  setTimeout(() => $('#copy').textContent = '답 복사하기', 2600);
};
}
</script>
